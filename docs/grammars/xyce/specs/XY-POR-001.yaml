id: XY-POR-001
dialect: xyce
construct: P port (`port=` and `Z0=` between the DC and AC parts)
manual_ref:
- '[xyce-ref] §2.3.11 p231 "Port Device"'
- '[xyce-ug] §7.11.2 p136 "Port Specification"'
status: validated
validated_on:
- solver: xyce
  version: XyceNF Release 7.10.0
  date: '2026-11-22'
grammar:
- port_source
- _p0
- _p1
- _p2
- p_port
- p_z0
- PORT_KW
- Z0_KW
- P_NAME
core_rules:
- dc_spec
- ac_spec
- value
- EQ
tests:
- tests/grammar/xyce/test_xyce_port.py::test_the_port_line_and_its_parameters
- tests/grammar/xyce/test_xyce_port.py::test_port_forms_are_read
- tests/grammar/xyce/test_xyce_port.py::test_a_formula_port_number_is_held_as_written
- tests/grammar/xyce/test_xyce_port.py::test_a_port_may_stand_in_a_subcircuit_body
- tests/grammar/xyce/test_xyce_port.py::test_a_line_without_port_is_refused
- tests/grammar/xyce/test_xyce_port.py::test_the_port_number_is_an_integer_of_one_or_more
- tests/grammar/xyce/test_xyce_port.py::test_port_forms_are_refused
- tests/grammar/xyce/test_xyce_port.py::test_p_stays_the_coupled_line_on_ngspice
- tests/grammar/xyce/test_xyce_corpus.py::test_accept_files_round_trip_and_tile
- tests/solver/test_xyce_port_probes.py::test_a_port_is_a_source_behind_z0
- tests/solver/test_xyce_port_probes.py::test_a_port_runs_under_dc_tran_and_ac
- tests/solver/test_xyce_port_probes.py::test_a_port_stands_in_a_subcircuit_body
- tests/solver/test_xyce_port_probes.py::test_xyce_runs_what_the_library_refuses
- tests/solver/test_xyce_port_probes.py::test_xyce_stops_on
- tests/solver/test_xyce_port_probes.py::test_v_runs_port_and_ignores_z0
- tests/solver/test_xyce_port_probes.py::test_lin_needs_the_ports_numbered_one_to_n
- tests/solver/test_xyce_solver_corpus.py::test_accept_fixture_runs_in_xyce
validation_note: 'Validated on XyceNF Release 7.10.0: outside `.LIN` a port is its DC value behind Z0 (50 by default), in either order of `port=` and `Z0=`, with formulas, `+` lines and in a body; it runs under `.DC`, `.TRAN` and `.AC`. Xyce stops on a port number that is not an integer or a formula, a second `port=` or `Z0=`, a bare name, `ZO`, another parameter, the DC part after `port=` and one node. It runs a P line without `port=` (as a plain V source), port numbers 0, negative, signed or `1.0`, `port 1` and `Z0 100` without `=`, a complex Z0, `port=` after the AC part or the function, and a comma, which the library refuses; `.LIN` needs the ports numbered 1..N, which the library does not check (a `library-limit` row). `port=` on V makes V a port (a row).'
notes: '`PortSource`, a sibling of `VoltageSource` and `CurrentSource` (decision 0030 item 6; X-M8 checklist): `P n+ n- [[DC] v] port=n [Z0=v] [AC mag [ph]] [function]`, with `port=` and `Z0=` in `params` as written, in either order, each once, both with their `=` (blanks around it allowed). `port=` is required and takes an integer literal of 1 or more or an expression in braces or quotes; `Z0=` a number of the device-field reader or an expression. Exactly two nodes, no other parameter; allowed in a subcircuit body. The DC, AC and function parts are V''s (XY-SRC-001 to XY-SRC-004). `.LIN`''s numbering (1..N) is not checked (a `library-limit` row).'
