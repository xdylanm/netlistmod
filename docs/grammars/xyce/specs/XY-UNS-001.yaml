id: XY-UNS-001
dialect: xyce
construct: lines X-M0 does not read (element lines, dot-commands other than .END, indented lines)
manual_ref:
- '[xyce-ug] §4.1.3 p41 "Elements"'
- '[xyce-ug] §4.1.3.3 p43 "Netlist Commands"'
- '[xyce-ug] §4.1.3.1 p43 "Title, Comments and End"'
status: documented
grammar:
- unsupported_directive
- indented_line
- REST_TEXT
- INDENTED_LINE
core_rules:
- DOT_NAME
tests:
- tests/grammar/xyce/test_xyce_structure.py::test_every_element_line_is_unsupported
- tests/grammar/xyce/test_xyce_structure.py::test_every_other_dot_command_is_unsupported
- tests/grammar/xyce/test_xyce_structure.py::test_a_continued_dot_command_is_unsupported_whole
- tests/grammar/xyce/test_xyce_structure.py::test_an_indented_line_is_unsupported
- tests/grammar/xyce/test_xyce_structure.py::test_a_letter_xyce_does_not_have_is_rejected
- tests/architecture/test_hidden_dialects.py::test_the_public_loaders_refuse_an_element_line
validation_note: A refusal of the library's own (decision 0026), not a reading of the solver, so solver evidence cannot decide it; each construct gets its own entry in the milestone that reads it.
notes: An element line whose letter is in devices.md raises UnsupportedConstruct, naming the letter and its milestone; A and N are not Xyce letters, so they are a ParseError. A dot-command other than `.END`, with its `+` lines, raises UnsupportedConstruct; Xyce warns on an unknown one and ignores it (discrepancies.md). An indented line other than a `*` comment raises UnsupportedConstruct, since Xyce reads it as a comment and decision X-D1 (X-M1) settles how the library reads it. The whole source is parsed first, so a syntax error anywhere is reported before a refused line.
