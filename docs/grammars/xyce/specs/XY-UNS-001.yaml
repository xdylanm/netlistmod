id: XY-UNS-001
dialect: xyce
construct: lines the dialect does not read yet (element lines, the other dot-commands and .PREPROCESS forms, `+` lines after a refused dot-command)
manual_ref:
- '[xyce-ug] §4.1.3 p41 "Elements"'
- '[xyce-ug] §4.1.3.3 p43 "Netlist Commands"'
- '[xyce-ug] §4.1.3.2 p43 "Continuation Lines"'
- '[xyce-ref] §2.1.29 p126 ".PREPROCESS REMOVEUNUSED (Removal of Unused Components)"'
status: documented
grammar:
- unsupported_directive
- continuation_line
- REST_TEXT
- PLUS_LINE
- preprocess_other
- pp_word
core_rules:
- DOT_NAME
tests:
- tests/grammar/xyce/test_xyce_structure.py::test_every_element_line_is_unsupported
- tests/grammar/xyce/test_xyce_structure.py::test_every_other_dot_command_is_unsupported
- tests/grammar/xyce/test_xyce_structure.py::test_a_continued_dot_command_is_unsupported_whole
- tests/grammar/xyce/test_xyce_structure.py::test_a_continuation_after_comment_or_blank_lines_is_not_a_syntax_error
- tests/grammar/xyce/test_xyce_structure.py::test_a_continuation_line_is_refused_by_its_own_rule
- tests/grammar/xyce/test_xyce_structure.py::test_a_continuation_with_only_the_title_before_it_is_rejected
- tests/grammar/xyce/test_xyce_structure.py::test_a_letter_xyce_does_not_have_is_rejected
- tests/grammar/xyce/test_xyce_names_numbers.py::test_the_other_preprocess_forms_are_unsupported
- tests/architecture/test_hidden_dialects.py::test_the_public_loaders_refuse_an_element_line
validation_note: A refusal of the library's own (decisions 0026 and 0027), not a reading of the solver, so solver evidence cannot decide it; each construct gets its own entry in the task or milestone that reads it.
notes: An element line whose letter is in devices.md raises UnsupportedConstruct, naming the letter and its milestone; A and N are not Xyce letters, so they are a ParseError. A dot-command the dialect does not read yet, with its `+` lines, raises UnsupportedConstruct; Xyce warns on an unknown one and ignores it (discrepancies.md). The `.PREPROCESS` forms other than REPLACEGROUND are UnsupportedConstruct. A `+` line after comment or blank lines that follow a refused dot-command joins it (p43) and is accepted by the grammar; the statement it joins is refused first. A `+` line with only the title, comments and blank lines before it joins nothing, as the title is a comment, and is a ParseError, as on Xyce. `$` and `//` at the start of a line are a ParseError, since neither is a comment in the manual's rules or on Xyce. The whole source is parsed first, so a syntax error anywhere is reported before a refused line.
