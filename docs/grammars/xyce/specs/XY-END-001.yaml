id: XY-END-001
dialect: xyce
construct: required final .END statement
manual_ref:
- '[xyce-ug] §4.1.1 p40 "Introduction"'
- '[xyce-ug] §4.1.3.1 p42 "Title, Comments and End"'
- '[xyce-ref] §2.1.6 p33 ".END (End of Circuit)"'
status: validated
validated_on:
- solver: xyce
  version: XyceNF Release 7.10.0
  date: '2026-11-15'
grammar:
- end_stmt
core_rules:
- trailer
- END_KW
tests:
- tests/grammar/xyce/test_xyce_structure.py::test_end_is_case_insensitive
- tests/grammar/xyce/test_xyce_structure.py::test_end_may_end_with_a_semicolon_comment
- tests/grammar/xyce/test_xyce_structure.py::test_end_is_required
- tests/grammar/xyce/test_xyce_structure.py::test_end_is_last_with_only_blank_lines_after_it
- tests/solver/test_xyce_names_probes.py::test_end_may_end_with_a_semicolon_comment
- tests/solver/test_xyce_names_probes.py::test_end_with_text_after_it_runs
- tests/solver/test_xyce_structure_probes.py::test_a_netlist_without_end_runs
- tests/solver/test_xyce_structure_probes.py::test_text_after_end_is_ignored
validation_note: 'Validated on XyceNF Release 7.10.0: Xyce ends the netlist at `.END`, also with a `;` comment on its line. It also runs a netlist without `.END`, with text after it, and `.end junk`, all refused here (discrepancies.md).'
notes: 'Decided at G1 (decision 0027 item 2): `.END` is required and last, with only blank lines after it, as on ngspice and LTspice; it is case-insensitive, its newline may be missing at the end of input, and a `;` comment may end its line, since `;` may end any line. Any other text on its line is refused.'
