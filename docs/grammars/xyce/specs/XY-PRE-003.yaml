notes: 'Decision 0031 item 10 (G1 point 26 (c)), amending decision 0028 item 1: `.PREPROCESS REMOVEUNUSED` then a comma list of at least one of C, D, I, L, M, Q, R and V, in any case, continued by `+` lines (a comma may start or end one): an `UnknownDirective` named `.PREPROCESS` as written, with `UNTYPED_DIRECTIVE_PRESERVED` (info), whose message names the two untyped forms, ADDRESISTORS and REMOVEUNUSED, since both are named `.PREPROCESS`. Xyce removes each listed device whose terminals are one node (on M and Q the first three) from the circuit it runs; the netlist and its topology stay as written (P4), and there is no device warning. A repeated letter is read, as Xyce runs it. One line per netlist, a body included: a second is a ParseError at its keyword, as Xyce stops on it. An empty list, another letter (`J`, `X`) or word (`RC`), a braced or quoted value, a trailing comma and letters separated by blanks only are a ParseError: Xyce stops on an empty list, another letter and braces, and runs a trailing comma and blank separators (rows `refuses/runs`, `manual`, with B5). Removal that depends on how instances connect is a `reads/runs`, `library-limit` row.'
