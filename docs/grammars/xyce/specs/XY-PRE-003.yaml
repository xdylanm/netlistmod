id: XY-PRE-003
dialect: xyce
construct: .PREPROCESS REMOVEUNUSED with a comma list of C, D, I, L, M, Q, R and V (an UnknownDirective)
manual_ref:
- '[xyce-ref] §2.1.29 p126 ".PREPROCESS REMOVEUNUSED (Removal of Unused Components)"'
status: validated
validated_on:
- solver: xyce
  version: XyceNF Release 7.10.0
  date: '2026-11-23'
validation_note: 'Validated on XyceNF Release 7.10.0: Xyce removes each listed device whose terminals are one node (the first three on M and Q), per instance in a body, ground synonyms only under REPLACEGROUND; it runs a repeated letter, a blank after a comma and `+` lines, runs blank separators and a trailing comma (refused: rows), and stops on an empty list, another letter, braces and a second line (discrepancies.md).'
grammar:
- preprocess_removeunused
- pp_removeunused
- ru_letter
- ru_next_letter
- ru_bad_first
- ru_bad_next
- ru_trailing
- ru_blank
- _ru_other
- REMOVEUNUSED_KW
- RU_LETTER
core_rules:
