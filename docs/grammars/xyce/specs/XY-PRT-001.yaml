validation_note: 'Observed on XyceNF Release 7.10.0 (X-M2.1 C3): each type of the manual''s list runs, in any case, under an analysis it agrees with, and `+` lines continue the line. Which analyses a type agrees with rests on the solver, which checks every `.PRINT` type against the first analysis line other than `.OP` and stops on any other (the manual says only that a `.PRINT` line whose type does not suit the analysis is not processed); an analysis''s type writes nothing when another analysis runs. `TR` runs as TRAN, a `.PRINT` with a type and no field runs, and Xyce stops on some bodies the library does not check; the library checks only that a field follows the type, so a body of options only (`.print tran format=csv`) is read, and Xyce runs it. Xyce checks `.LIN` as a print type SPARAM, which the library does not (discrepancies.md; X-M2.1 R1).'
notes: '`PrintDirective` (internal, in `netlistmod.model.nodes`; decision 0029 item 5), typed shallowly as `.MEASURE` is: `print_type` is the type as written, required and first, one of AC, AC_IC, DC, ES, HB, HB_FD, HB_IC, HB_STARTUP, HB_TD, NOISE, PCE and TRAN (the table of §2.1.31), HOMOTOPY, SENS and TRANADJOINT (§2.1.31.6 and §2.1.31.7), in any case, ending where its word ends; `body_text` is the source slice of `body_span`, from the first to the last field after the type, at least one, each a `FIELD_TEXT` (XY-DIR-001''s), across `+` lines (comments on earlier lines of a continued statement are inside it). Another field in the type''s place (with the hint "write `TRAN`" for `TR`), no type and no field after the type are a ParseError. Top level only: in a body Xyce silently ignores it (XY-DIR-003). The document layer reports `PRINT_TYPE_MISMATCH` (warning) on a type that does not agree with the first analysis, or whose analysis does not run. ngspice''s `.print` stays an `UnknownDirective`.'
