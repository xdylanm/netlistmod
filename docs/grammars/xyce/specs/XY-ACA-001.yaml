id: XY-ACA-001
dialect: xyce
construct: .AC small-signal analysis (a sweep, or DATA=)
manual_ref:
- '[xyce-ref] §2.1.1 p24 ".AC (AC Analysis)"'
status: validated
validated_on:
- solver: xyce
  version: XyceNF Release 7.10.0
  date: '2026-11-16'
grammar:
- xy_ac_stmt
core_rules:
- DOT_AC_KW
- ac_variation
- DEC_KW
- OCT_KW
- LIN_KW
- value
tests:
- tests/grammar/xyce/test_xyce_analyses.py::test_ac_takes_a_variation_and_three_values
- tests/grammar/xyce/test_xyce_analyses.py::test_ac_takes_a_data_table
- tests/grammar/xyce/test_xyce_analyses.py::test_malformed_ac_is_rejected
- tests/grammar/xyce/test_xyce_analyses.py::test_analyses_and_step_are_refused_in_a_body
- tests/grammar/xyce/test_xyce_analyses.py::test_the_ac_point_count_is_not_checked
- tests/solver/test_xyce_analysis_probes.py::test_ac_sweeps
- tests/solver/test_xyce_analysis_probes.py::test_ac_stops_on
- tests/solver/test_xyce_analysis_probes.py::test_a_point_count_that_is_not_an_integer_stops_xyce
- tests/solver/test_xyce_analysis_probes.py::test_only_the_last_analysis_runs
- tests/solver/test_xyce_analysis_probes.py::test_a_stepped_parameter_in_a_dc_or_ac_field_stops_xyce
validation_note: 'Validated on XyceNF Release 7.10.0: the three variations sweep from the library''s fstart to its fstop; `list` and an imaginary number stop Xyce; a point count that is not an integer stops it too, which the library reads (discrepancies.md); a field that reads a stepped parameter stops Xyce, as `STEPPED_ANALYSIS_FIELD` says.'
notes: '`AcDirective`: `LIN|OCT|DEC points fstart fstop` (`variation` as written), or `DATA=table` alone (XY-DCA-002; `data`, `variation` is `data` as written, the range fields `None`). No `list` and no `file=` (LTspice''s). The point count is not checked to be an integer. Top level only. The `%extend` of `ac_variation` (an indented line between its gap and the keyword) is XY-IND-001''s.'
