id: XY-DCA-002
dialect: xyce
construct: DATA=table on .AC, .DC and .STEP
manual_ref:
- '[xyce-ref] §2.1.3.5 p28 "Data Sweeps"'
- '[xyce-ref] §2.1.1 p24 ".AC (AC Analysis)"'
- '[xyce-ref] §2.1.36.5 p157 "Data Sweeps"'
status: validated
validated_on:
- solver: xyce
  version: XyceNF Release 7.10.0
  date: '2026-11-16'
grammar:
- data_ref
- DATA_KW
core_rules:
- EQ
tests:
- tests/grammar/xyce/test_xyce_analyses.py::test_ac_takes_a_data_table
- tests/grammar/xyce/test_xyce_analyses.py::test_dc_takes_a_data_table_alone
- tests/grammar/xyce/test_xyce_analyses.py::test_step_takes_a_data_table
- tests/grammar/xyce/test_xyce_analyses.py::test_a_dc_target_named_like_a_keyword_part_is_a_name
- tests/grammar/xyce/test_xyce_analyses.py::test_malformed_dc_is_rejected
- tests/grammar/xyce/test_xyce_analyses.py::test_a_second_sweep_on_one_step_line_is_rejected
- tests/solver/test_xyce_directive_probes.py::test_dc_data_sweeps_the_rows
- tests/solver/test_xyce_directive_probes.py::test_step_data_steps_the_rows
- tests/solver/test_xyce_directive_probes.py::test_ac_and_noise_data_take_the_frequencies
- tests/solver/test_xyce_directive_probes.py::test_tran_takes_no_data
- tests/solver/test_xyce_directive_probes.py::test_an_unknown_table_stops_xyce
- tests/solver/test_xyce_analysis_probes.py::test_a_data_step_drops_the_other_steps
validation_note: 'Validated on XyceNF Release 7.10.0: `DATA=` on `.DC`, `.STEP`, `.AC` and `.NOISE` sweeps the table''s rows, an unknown name stops Xyce, `.TRAN` takes none, and a `.STEP DATA=` line drops every other `.STEP` line.'
notes: '`DATA` in any case, blanks allowed around the `=`, then the table''s name (a WORD, XY-NAM-001), alone on its line: `AcDirective.data`, `DcDirective.data` (with no sweeps) and `StepDirective.data` (`kind` `data`), each an `Identifier`. DATA_KW''s lookahead finds the `=`, so a sweep target named `data` stays a name. Resolving the name against a `.DATA` block (the `data` reference kind and `UNRESOLVED_DATA`) is X-M2 B5''s, the block B3''s.'
