id: XY-MOS-001
dialect: xyce
construct: M MOSFET lines (3 to 7 nodes, no area, OFF, IC=, TNODEOUT= and the closed parameter list)
manual_ref:
- '[xyce-ref] §2.3.20 p292 "MOS Field Effect Transistor (MOSFET)"'
status: validated
validated_on:
- solver: xyce
  version: XyceNF Release 7.10.0
  date: '2026-11-23'
validation_note: 'Validated on XyceNF Release 7.10.0: 3 to 7 nodes, each level taking its counts (the level table), an 8th node dropped; no area; the closed list, `M=` scaling the current, `OFF` and `OFF=`; `TNODEOUT=` with any value moves BSIM-SOI''s range to 5 to 7 nodes, and a bare `TNODEOUT` stops Xyce; `IC=` lists of up to the level''s count run. Xyce stops on an unknown name, `thermal`, a name of another level and an `IC=` count above the level''s, and runs a repeated parameter (the last value) or `OFF` and `IC=` beside `IC1=` (discrepancies.md).'
grammar:
- mosfet
- _m_tail
- m_param
- m_flag
- m_ic_param
- m_unlisted
- m_keyword
- m_late_value
- M_PARAM_KW
- TNODEOUT_KW
- THERMAL_KW
- M_NAME
core_rules:
- OFF_KW
- CSEP
- EQ
tests:
- tests/grammar/xyce/test_xyce_mosfet.py::test_the_model_is_the_last_name
- tests/grammar/xyce/test_xyce_mosfet.py::test_off_tnodeout_and_thermal_right_after_the_fixed_nodes_are_nodes
- tests/grammar/xyce/test_xyce_mosfet.py::test_a_number_off_tnodeout_or_a_colon_in_the_models_place_is_refused
- tests/grammar/xyce/test_xyce_mosfet.py::test_node_counts_outside_3_to_7_are_refused
