id: XY-COM-001
dialect: xyce
construct: comments (`*` lines, `;` lines and `;` at the end of a line)
manual_ref:
- '[xyce-ug] §4.1.3.1 p43 "Title, Comments and End"'
- '[xyce-ref] §2.1.39.1 p163 "* (Comment)"'
- '[xyce-ref] §2.1.39.2 p163 "; (In-line Comment)"'
status: validated
validated_on:
- solver: xyce
  version: XyceNF Release 7.10.0
  date: '2026-11-15'
grammar:
- COMMENT_LINE
- TRAILING_COMMENT
core_rules: []
tests:
- tests/grammar/xyce/test_xyce_structure.py::test_title_comments_blank_lines_and_end_tile_the_source
- tests/grammar/xyce/test_xyce_structure.py::test_a_line_that_begins_with_a_semicolon_is_a_comment
- tests/grammar/xyce/test_xyce_names_numbers.py::test_global_takes_several_names_and_continues
- tests/solver/test_xyce_structure_probes.py::test_a_continuation_joins_across_comments_and_blank_lines
- tests/solver/test_xyce_structure_probes.py::test_a_semicolon_ends_a_line
- tests/solver/test_xyce_structure_probes.py::test_a_semicolon_line_is_a_comment
validation_note: 'Validated on XyceNF Release 7.10.0: `*` lines and lines that begin with `;` are comments, `;` ends any line with or without a blank before it, and a `+` line joins across both kinds of comment line.'
notes: A line that begins with `*` or `;`, after blanks or not, is a comment line (a `CommentLine`, its text without the leading blanks). An end-of-line comment starts at `;`, which needs no blank before it, and runs to the end of the line; it is a trailing comment of its statement. TRAILING_COMMENT also matches the comment and indented lines that a `+` line joins across (XY-CNT-001), only right after a line end. `$` and `//` are not comments, in the manual's rules or on Xyce (discrepancies.md).
