validation_note: 'Observed on XyceNF Release 7.10.0: each command but `.PCE` runs and writes its output (`.HB`, `.LIN` and `.EMBEDDEDSAMPLING` only without `-r`); that `.NOISE` and `.HB` take part in the last-line rule of the analyses rests on the solver (xm2-tasks 5.1 point 31; `.HB` probed in X-M2.1, `tests/solver/test_xyce_analysis_probes.py`). This build reports `.PCE` as unrecognized (discrepancies.md). `.PRINT` was one of these commands until X-M2.1, which types it (XY-PRT-001).'
notes: 'Each is an `UnknownDirective` (`name` as written, `raw` from the name to the end of its last field, `trailing_comments`), which the document layer reports with `UNTYPED_DIRECTIVE_PRESERVED` (info), as the untyped commands of the other dialects. The name is one of the eleven, in any case, ending where its word ends, so `.prints` or `.save_all` is not one (XY-DIR-002). The fields are runs of characters other than blanks and `;` (`FIELD_TEXT`, which `.MEASURE`''s body shares), any number of them, continued by `+` lines across blank, comment and indented lines (XY-CNT-001), which Xyce joins. None changes the circuit, so none is typed in X-M2. Top level only: in a subcircuit body Xyce silently ignores them, so they are a ParseError there (XY-DIR-003). `.SAVE` has a terminal of its own (XY-SAV-001).'
