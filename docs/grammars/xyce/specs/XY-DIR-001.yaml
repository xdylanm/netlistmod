id: XY-DIR-001
dialect: xyce
construct: the closed list's untyped dot-commands (.PRINT, .FOUR, .FFT, .RESULT, .SAVE, .SENS, .NOISE, .HB, .LIN, .SAMPLING, .EMBEDDEDSAMPLING, .PCE) as UnknownDirective
manual_ref:
- '[xyce-ref] §2.1.31 p128 ".PRINT (Print output)"'
- '[xyce-ref] §2.1.9 p40 ".FOUR (Fourier Analysis)"'
- '[xyce-ref] §2.1.8 p35 ".FFT (FFT Analysis)"'
- '[xyce-ref] §2.1.32 p149 ".RESULT (Print results)"'
- '[xyce-ref] §2.1.34 p152 ".SAVE (Save operating point conditions)"'
- '[xyce-ref] §2.1.35 p153 ".SENS (Compute DC, AC or transient sensitivities)"'
- '[xyce-ref] §2.1.23 p93 ".NOISE (Noise Analysis)"'
- '[xyce-ref] §2.1.13 p47 ".HB (Harmonic Balance Analysis)"'
- '[xyce-ref] §2.1.17 p52 ".LIN (Linear Analysis)"'
- '[xyce-ref] §2.1.33 p150 ".SAMPLING (Sampling UQ Analysis)"'
- '[xyce-ref] §2.1.5 p30 ".EMBEDDEDSAMPLING (Embedded Sampling)"'
- '[xyce-ref] §2.1.27 p122 ".PCE (Fully Intrusive Polynomial Chaos Expansion (PCE) Analysis)"'
- '[xyce-ug] §4.1.3.2 p43 "Continuation Lines"'
status: documented
grammar:
- xy_unknown_stmt
- unknown_field
- DOT_NAME
- FIELD_TEXT
core_rules:
- eol
tests:
- tests/grammar/xyce/test_xyce_closed_list.py::test_each_untyped_command_is_an_unknown_directive
- tests/grammar/xyce/test_xyce_closed_list.py::test_an_untyped_command_may_have_no_field
- tests/grammar/xyce/test_xyce_closed_list.py::test_an_untyped_command_continues_across_comment_and_blank_lines
- tests/grammar/xyce/test_xyce_closed_list.py::test_an_untyped_command_carries_the_untyped_diagnostic
- tests/grammar/xyce/test_xyce_closed_list.py::test_the_untyped_commands_round_trip
- tests/grammar/xyce/test_xyce_closed_list.py::test_an_untyped_command_is_refused_in_a_body
- tests/grammar/xyce/test_xyce_structure.py::test_every_other_dot_command_is_refused
validation_note: Read from the manual (decision 0028 item 1; xm2-tasks 5.1 points 1 and 3). The stage 1 probes on XyceNF Release 7.10.0 are recorded in xm2-tasks 5.1 (each command runs; this build reports `.PCE` as unrecognized and ignores it); the solver tests and the discrepancy row for `.PCE` are X-M2 B6's.
notes: 'Each is an `UnknownDirective` (`name` as written, `raw` from the name to the end of its last field, `trailing_comments`), which the document layer reports with `UNTYPED_DIRECTIVE_PRESERVED` (info), as the untyped commands of the other dialects. The name is one of the twelve, in any case, ending where its word ends, so `.prints` or `.save_all` is not one (XY-DIR-002). The fields are runs of characters other than blanks and `;` (`FIELD_TEXT`, which `.MEASURE`''s body shares), any number of them, continued by `+` lines across blank, comment and indented lines (XY-CNT-001), which Xyce joins. None changes the circuit, so none is typed in X-M2. Top level only: in a subcircuit body Xyce silently ignores them, so they are a ParseError there (XY-DIR-003). `.SAVE` has a terminal of its own (XY-SAV-001).'
