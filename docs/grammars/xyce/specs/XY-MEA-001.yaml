id: XY-MEA-001
dialect: xyce
construct: .MEASURE and .MEAS (a required mode of the closed list; the body kept as text)
manual_ref:
- '[xyce-ref] §2.1.18 p54 ".MEASURE or .MEAS (Measure output)"'
- '[xyce-ref] §2.1.19 p78 ".MEASURE (Continuous results)"'
- '[xyce-ref] §2.1.20 p84 ".MEASURE FFT (Measure output for .FFT)"'
status: documented
grammar:
- xy_meas_stmt
- meas_mode
- meas_bad_mode
- meas_field
- MEAS_MODE_KW
core_rules:
- MEAS_KW
- MEASURE_KW
- x_name
tests:
- tests/grammar/xyce/test_xyce_directives.py::test_measure_takes_each_mode_of_the_manual
- tests/grammar/xyce/test_xyce_directives.py::test_meas_is_a_synonym_and_the_body_continues
- tests/grammar/xyce/test_xyce_directives.py::test_a_measure_mode_outside_the_list_is_rejected
- tests/grammar/xyce/test_xyce_directives.py::test_a_measure_without_its_body_is_rejected
- tests/grammar/xyce/test_xyce_directives.py::test_options_measures_and_tables_are_refused_in_a_body
validation_note: Read from the manual (decision 0028 item 7; xm2-tasks 5.1 point 26). The stage 1 probes on XyceNF Release 7.10.0 are recorded in xm2-tasks 5.1; the solver tests and the discrepancy row (`TR`, which Xyce runs) are X-M2 B6's.
notes: '`MeasureDirective`, typed shallowly as on ngspice and LTspice: `analysis` is the mode as written, required, one of TRAN, DC, AC, NOISE, FFT, TRAN_CONT, DC_CONT, AC_CONT and NOISE_CONT, in any case; `result` the result name; `body_text` the source slice of `body_span`, from the first to the last field of the body, which must have at least one field, each a run of characters other than blanks and `;` (`FIELD_TEXT`, XY-DIR-001''s) (comments on earlier lines of a continued statement are inside it). `TR`, `HB`, `OP`, `SP`, any other word and a missing mode are a ParseError. Top level only. A mode with no matching analysis and a repeated result name are the document layer''s (X-M2 B5).'
