validation_note: 'Observed on XyceNF Release 7.10.0: the packages are the manual''s, but `.OPTION` as a full synonym of `.OPTIONS` rests on the solver (§11.3 rule 3). An unknown package and a package-less line are ignored with a warning, except a package-less `TEMP=` or `TNOM=` alone, which Xyce applies; PCES is unrecognized; the plural `.OPTIONS SCALE=` runs (discrepancies.md).'
notes: '`OptionsDirective` with `package`, the package as written (an `Identifier`): one of the manual''s 21 (DEVICE, DIAGNOSTIC, TIMEINT, NONLIN, NONLIN-TRAN, NONLIN-HB, LOCA, LINSOL, LINSOL-HB, LINSOL-AC, OUTPUT, RESTART, SAMPLES, EMBEDDEDSAMPLES, PCES, SENSITIVITY, HBINT, DIST, FFT, MEASURE, PARSER), in any case. Any other word is a ParseError naming the closest package; a line without a package, or with a package and no item, is a ParseError, except `.OPTION SCALE=v` (singular, exactly one item), read with `package` `None`. A package-less line whose only item is `TEMP=` or `TNOM=`, which Xyce applies, gets the hint to write `.OPTIONS DEVICE TEMP=` (or `TNOM=`); any other package-less line, which Xyce ignores with a warning, the plain message (X-M2 B6). The items are XY-OPT-002''s. Top level only: in a body Xyce silently ignores it, so it is a ParseError there. A repeated item (Xyce uses the first value) is the document layer''s (X-M2 B5).'
