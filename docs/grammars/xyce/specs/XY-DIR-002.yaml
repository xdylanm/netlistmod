id: XY-DIR-002
dialect: xyce
construct: any other dot-command is refused (not an Xyce dot-command), with hints
manual_ref:
- '[xyce-ref] §2.1 p24 "Netlist Commands"'
- '[xyce-ref] §6.1.14 p847 "Additional differences"'
- '[xyce-ref] §6.1.4 p843 ".PROBE vs. .PRINT"'
- '[xyce-ug] §4.1.3.1 p42 "Title, Comments and End"'
status: documented
grammar:
- body_statement
- top_statement
core_rules: []
tests:
- tests/grammar/xyce/test_xyce_closed_list.py::test_each_untyped_command_is_an_unknown_directive
- tests/grammar/xyce/test_xyce_closed_list.py::test_another_dot_command_is_refused_at_its_first_character
- tests/grammar/xyce/test_xyce_closed_list.py::test_some_refusals_carry_a_hint
- tests/grammar/xyce/test_xyce_closed_list.py::test_step_param_and_a_stray_enddata_keep_their_own_refusals
- tests/grammar/xyce/test_xyce_closed_list.py::test_a_would_be_block_is_refused_at_its_opener
- tests/grammar/xyce/test_xyce_closed_list.py::test_a_refused_command_in_a_body_is_refused_as_at_the_top_level
- tests/grammar/xyce/test_xyce_structure.py::test_every_other_dot_command_is_refused
- tests/grammar/xyce/test_xyce_corpus.py::test_reject_files_fail_where_the_manifest_says
validation_note: Read from the manual (decision 0028 item 1; xm2-tasks 5.1 points 1 and 2). The stage 1 probes on XyceNF Release 7.10.0 are recorded in xm2-tasks 5.1 (Xyce warns "Unrecognized dot line will be ignored" and runs; it reads the lines of an unknown block as circuit lines; `.step param` stops it); the solver tests and the discrepancy rows for each command Xyce runs are X-M2 B6's.
notes: 'The closed list (decision 0028 item 1) is every statement of `body_statement` and `top_statement`: the typed directives, the statements of decision 0027, the untyped commands of XY-DIR-001 and `.PREPROCESS` (XY-PRE-001, XY-PRE-002, and REMOVEUNUSED, XY-UNS-001). Any other dot-command matches no terminal at a line start, so the parser stops at its `.` and the loader raises a ParseError "`<name>` is not an Xyce dot-command, or is not allowed here", at the top level and in a body: Table 6-1''s commands (`.TEMP`, `.TF`, `.PZ`, `.DISTO`, `.MC`, `.WCASE`, `.PLOT`, `.PROBE` and the rest), `.title`, `.backanno`, `.control`/`.endc`, `.if`, `.aliases`, the binary''s `.MOR`, `.INITCOND` and `.LOAD`, and misspellings (`.tarn`, `.optoins`, `.opt`, `.tranx`; a keyword that is only the start of the word is not matched, and the error is placed at the word). The hints: `.TEMP` (`.STEP TEMP` or `.OPTIONS DEVICE TEMP=`), `.PROBE` (`.PRINT ... FORMAT=PROBE`), `.title` (the first line is the title) and `.opt` (`.OPTIONS`); `.step param` (XY-STP-001) and a stray `.ENDDATA` (XY-DAT-001) keep their own refusals. The refusal is at the opener of a would-be block, so its lines are never read.'
