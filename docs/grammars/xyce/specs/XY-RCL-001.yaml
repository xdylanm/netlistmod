validation_note: 'Validated on XyceNF Release 7.10.0, values compared through a divider (R) and the current of a 1 kHz AC source (C, L): the model before the value, `R=`, `C=`, `L=`, the charge `Q=`, the geometry form (RSH x L / W; an explicit value replaces it), `TC=a,b`, `M=`. Xyce stops on the long value keywords, a C with none of C, Q and L, an L without a value and three `TC=` values. It runs the ngspice order, a bare name as the value, an R without a value (1 kΩ) and a value written twice, which the library refuses (discrepancies.md).'
notes: 'The ngspice `Resistor`, `Capacitor` and `Inductor` nodes (decision 0027 item 5, point 10 as amended by the maintainer). The model, a WORD, comes right after the nodes, then the value (positional: a NUMBER of the device reader, or an expression in braces or quotes). A field that reads as a number is the value, never a model (decision 0024 item 7), and a word after the value is refused with the hint "Xyce writes the model before the value". The value may instead be the parameter `R=`, `C=` or `L=` (value_keyword as written, the parameter left out of params); both together are a ParseError. R needs a value, positional or `R=`, unless it is the geometry form, a model with both `L=` and `W=`. C needs a value, `C=`, the charge `Q=` (an expression, Capacitor.charge) or `L=` (the semiconductor form, as Xyce requires "C, Q, or L"); a value with `Q=` is a ParseError. L needs a value. `TC=` takes one value, or two separated by a comma (a ValueList). `resistance=`, `capacitance=` and `inductance=` are refused. A bare name after the nodes is the model; when the line then has no value the message suggests braces. The document layer''s diagnostic for a model name that is a visible parameter, and the warning on a `.model` whose name reads as a number, are X-M1 B6''s.'
