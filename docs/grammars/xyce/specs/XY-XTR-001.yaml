id: XY-XTR-001
dialect: xyce
construct: shared transistor line shape (Q, M, J, Z), with the model types, binned M models, the node count against the model's LEVEL and the area edits
manual_ref:
- '[xyce-ref] §2.3.17 p241 "Bipolar Junction Transistor (BJT)"'
- '[xyce-ref] §2.3.18 p286 "Junction Field-Effect Transistor (JFET)"'
- '[xyce-ref] §2.3.19 p290 "Metal-Semiconductor FET (MESFET)"'
- '[xyce-ref] §2.3.20 p292 "MOS Field Effect Transistor (MOSFET)"'
status: validated
validated_on:
- solver: xyce
  version: XyceNF Release 7.10.0
  date: '2026-11-23'
validation_note: 'Validated on XyceNF Release 7.10.0: the boundary rule agrees with Xyce on every valid line, and differs where a node names a model whose level takes the count so far (Xyce stops; NODE_COUNT_MISMATCH warns); Xyce runs a number or `off` as the model, which the library refuses. The level table holds for a level of each `extra` kind, except FBH level 23, which drops a 5th node where the table says Xyce stops (found in X-M4 B5 and reported). The types of each letter run and the others stop Xyce. Binned M models: Xyce selects by `L=` and `W=` (half-open bounds), any suffix, an exact name first, across the scope chain, not under `MODEL_BINNING=false`, not on Q or J; a set no bin takes, a bin missing a bound, mixed bins and the `.STEP` choice are rows (discrepancies.md).'
grammar:
- xt_name
- xt_number
- xt_area
- xt_late_area
core_rules:
- OFF_KW
