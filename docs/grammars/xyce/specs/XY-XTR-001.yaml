id: XY-XTR-001
dialect: xyce
construct: shared transistor line shape (Q, M, J, Z), with the model types, binned M models, the node count against the model's LEVEL and the area edits
manual_ref:
- '[xyce-ref] §2.3.17 p241 "Bipolar Junction Transistor (BJT)"'
- '[xyce-ref] §2.3.18 p286 "Junction Field-Effect Transistor (JFET)"'
- '[xyce-ref] §2.3.19 p290 "Metal-Semiconductor FET (MESFET)"'
- '[xyce-ref] §2.3.20 p292 "MOS Field Effect Transistor (MOSFET)"'
status: documented
validation_note: Read from the manual and the X-M4 stage 1 probes (decision 0031); the solver tests that compare it with XyceNF 7.10 come with X-M4 B5.
grammar:
- xt_name
- xt_number
- xt_area
- xt_late_area
core_rules:
- OFF_KW
