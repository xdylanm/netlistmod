notes: 'Decision 0014 item 1 with decision 0031 items 1 to 3: the fixed nodes, then names, the last of which is the model, then an optional positional area, then flags and parameters. A name field is a node field (NODE_WORD), so `[s]` is a node named `[s]` and `X1:n` a node path; a number is a node before the model and the area after it; right after the fixed nodes `off` is a node, after a name it is the flag. A number, `off` or a `:` in the model''s place is refused (Xyce runs `.model 2 npn`: a `refuses/runs` row). The area is positional, a number or a braced or quoted expression (Transistor.area), or `area=`, not both (Xyce stops); a positional area may be followed by parameters (G1 6 (a), a `reads/stops` row); after a flag or parameter it is a ParseError (Xyce runs it as the area: a `refuses/runs` row). Counts are by letter. M has no area (XY-MOS-001). The document and edit layers (X-M4 B4; decision 0031 items 5 to 9): the types are Q NPN and PNP, M NMOS and PMOS (VDMOS is NMOS or PMOS at LEVEL=18), J NJF and PJF, Z NMF and PMF; a wrong type is MODEL_TYPE_MISMATCH, which says Xyce stops. An M names a set of bins (`nch` for `nch.<suffix>`, any non-empty suffix, folded) when no exact name is visible in the scope chain, unless `.OPTIONS PARSER MODEL_BINNING` is a literal false or 0; the reference targets the first bin (scope chain, then source order), `Index.model_bins` holds the set, each bin of another type is a MODEL_TYPE_MISMATCH, and a `head:param` target stays exact (scoping.md S13). NODE_COUNT_MISMATCH (warning) checks the count written against the LEVEL of the visible model, or of each bin, from `model/xyce-levels.json` (5.1 point 11), and a node before the model that names a model whose level takes the count so far; silent when unresolved or the level is unknown; the topology stays the nodes written. set_param `area` on Q, J and Z replaces an area where it is written, or adds `area=v` at the end of the line (G1 point 21); on M it is an EditError; set_model takes a set whose bins are all NMOS or PMOS, set_model_param refuses a set name; `area=`, `IC=` and `TNODEOUT=` are ordinary parameters (G1 point 24 (b)).'
