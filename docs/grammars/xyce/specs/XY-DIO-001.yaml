id: XY-DIO-001
dialect: xyce
construct: D diode lines (model, positional area, flags and parameters)
manual_ref:
- '[xyce-ref] §2.3.8 p207 "Diode"'
status: validated
validated_on:
- solver: xyce
  version: XyceNF Release 7.10.0
  date: '2026-11-15'
grammar:
- diode
- d_flag
- OFF_VALUE_KW
- D_NAME
core_rules:
- model
- value
- OFF_KW
tests:
- tests/grammar/xyce/test_xyce_elements.py::test_the_diode_forms
- tests/grammar/xyce/test_xyce_elements.py::test_a_diode_needs_its_model_first
- tests/grammar/xyce/test_xyce_elements.py::test_a_number_is_never_a_model
- tests/solver/test_xyce_element_probes.py::test_diode_forms
- tests/solver/test_xyce_element_probes.py::test_the_positional_area_scales_the_current
- tests/solver/test_xyce_element_probes.py::test_xyce_runs
validation_note: 'Validated on XyceNF Release 7.10.0: the model, a positional area (a number or an expression) that scales the current, `OFF` and `OFF=1`, and parameters. Xyce drops a number written before the model, which the library refuses (discrepancies.md).'
notes: 'The ngspice `Diode` node, as LTspice''s D (decision 0027 item 6; point 13): the model, a WORD and never a number, then an optional positional area (Diode.area), then flags (`OFF`, or `OFF=` and a value, a `Flag` with its value) and instance parameters (XY-ELM-001), in any order.'
