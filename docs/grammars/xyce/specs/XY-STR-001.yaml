id: XY-STR-001
dialect: xyce
construct: netlist structure (title line, body lines, blank lines, final .END)
manual_ref:
- '[xyce-ug] §4.1.1 p40 "Introduction"'
status: validated
validated_on:
- solver: xyce
  version: XyceNF Release 7.10.0
  date: '2026-11-15'
grammar:
- start
- lead
- line
- statement
core_rules:
- LINE_END
- WS
tests:
- tests/grammar/xyce/test_xyce_structure.py::test_title_comments_blank_lines_and_end_tile_the_source
- tests/grammar/xyce/test_xyce_structure.py::test_crlf_and_a_missing_final_newline
- tests/grammar/xyce/test_xyce_names_numbers.py::test_structure_items_tile_with_the_new_statements
- tests/architecture/test_hidden_dialects.py::test_the_public_loaders_read_a_structure_only_netlist
- tests/grammar/xyce/test_xyce_corpus.py::test_accept_files_round_trip_and_tile
- tests/grammar/xyce/test_xyce_corpus.py::test_every_sub_span_lies_in_its_item_and_slices_back
- tests/grammar/xyce/test_xyce_corpus.py::test_queries_run_on_every_accept_file
- tests/grammar/xyce/test_xyce_corpus.py::test_a_crlf_twin_reads_as_its_lf_file
- tests/solver/test_xyce_structure_probes.py::test_a_continuation_joins_across_comments_and_blank_lines
- tests/solver/test_xyce_structure_probes.py::test_a_blank_line_one_is_the_title
- tests/solver/test_xyce_solver_corpus.py::test_accept_fixture_runs_in_xyce
- tests/solver/test_xyce_solver_corpus.py::test_the_top_level_nets_are_xyces_nodes
- tests/solver/test_xyce_solver_corpus.py::test_unedited_round_trip_gives_identical_results
- tests/solver/test_xyce_solver_corpus.py::test_xyce_stops_on_or_runs_each_rejection
validation_note: Validated by the X-M0 probes (tests/solver/test_xyce_structure_probes.py) on XyceNF Release 7.10.0. A blank line is also a line of blanks. The accept corpus of tests/corpus/xyce (X-M1 B7), which covers every construct X-M1 reads, runs in Xyce with an `.op` added, its top-level nets are Xyce's nodes, and an unedited save gives the same bytes and results; Xyce's outcome on each rejection fixture is checked against its manifest.
notes: The manual says the first line is a title and the last is `.END`, with the statements between them in any order. The lines before the first statement are `lead` lines (blank, comment and indented lines), which a `+` line cannot follow. A body statement may also stand in a subcircuit body (X-M1 B4); `.GLOBAL` is a top statement. The statements of `body_statement` and `top_statement` are the closed list of dot-commands (XY-DIR-002); every line the dialect does not read yet is refused (XY-UNS-001).
