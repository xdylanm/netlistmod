id: XY-STP-002
dialect: xyce
construct: sweep targets of .DC and .STEP (names, `dev:param`, `model:param`, paths, TEMP)
manual_ref:
- '[xyce-ref] §2.1.36 p155 ".STEP (Step Parametric Analysis)"'
- '[xyce-ref] §2.1.3 p27 ".DC (DC Sweep Analysis)"'
status: validated
validated_on:
- solver: xyce
  version: XyceNF Release 7.10.0
  date: '2026-11-16'
grammar:
- sweep_target
core_rules: []
tests:
- tests/grammar/xyce/test_xyce_analyses.py::test_step_takes_a_range
- tests/grammar/xyce/test_xyce_analyses.py::test_dc_takes_any_number_of_sweeps_each_with_its_own_form
- tests/grammar/xyce/test_xyce_analyses.py::test_a_dc_target_named_like_a_keyword_part_is_a_name
- tests/grammar/xyce/test_xyce_analyses.py::test_a_target_that_is_not_a_name_is_rejected
- tests/solver/test_xyce_analysis_probes.py::test_dc_sweeps_each_target
- tests/solver/test_xyce_analysis_probes.py::test_step_forms_and_targets
- tests/solver/test_xyce_analysis_probes.py::test_an_undefined_sweep_target_stops_xyce
- tests/solver/test_xyce_analysis_probes.py::test_a_path_to_a_device_needs_its_parameter
- tests/solver/test_xyce_analysis_probes.py::test_a_parameter_target_comes_before_a_device
validation_note: 'Validated on XyceNF Release 7.10.0: a source, `device:parameter`, `model:parameter`, `TEMP`, a `.PARAM`, a `.GLOBAL_PARAM` and `X1:R5:R` are swept; a name is a parameter before a device; a target that names nothing stops Xyce, and so does a path without its parameter (`X1:R5`), which the document layer reports as an unresolved element (`UNRESOLVED_ELEMENT`).'
notes: 'A target is a NODE_WORD (XY-NAM-001''s class with `:`): a source or device, a parameter, `TEMP`, `dev:param`, `model:param` or a path into an instance (`X1:R5:R`). The form does not tell a device from a parameter, nor `dev:param` from `model:param`, so a `.STEP` target''s `kind` is `name`, `qualified` (with `parameter`, the part after the last `:`, read from the form alone, so `R5` in a path to a device without its parameter, `X1:R5`) or `temp`; a `.DC` target is `DcSweep.source` as written. A target that reads as a number, or with an empty part around a `:`, is a ParseError. Resolving the target against the scope, a parameter first as Xyce does, is X-M2 B5''s.'
