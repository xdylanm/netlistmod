id: XY-STP-002
dialect: xyce
construct: sweep targets of .DC and .STEP (names, `dev:param`, `model:param`, paths, TEMP)
manual_ref:
- '[xyce-ref] §2.1.36 p155 ".STEP (Step Parametric Analysis)"'
- '[xyce-ref] §2.1.3 p27 ".DC (DC Sweep Analysis)"'
status: documented
grammar:
- sweep_target
core_rules: []
tests:
- tests/grammar/xyce/test_xyce_analyses.py::test_step_takes_a_range
- tests/grammar/xyce/test_xyce_analyses.py::test_dc_takes_any_number_of_sweeps_each_with_its_own_form
- tests/grammar/xyce/test_xyce_analyses.py::test_a_dc_target_named_like_a_keyword_part_is_a_name
- tests/grammar/xyce/test_xyce_analyses.py::test_a_target_that_is_not_a_name_is_rejected
validation_note: Read from the manual (decision 0028 item 4; xm2-tasks 5.1 points 12 and 14). The stage 1 probes on XyceNF Release 7.10.0 are recorded in xm2-tasks 5.1; the solver tests are X-M2 B6's.
notes: 'A target is a NODE_WORD (XY-NAM-001''s class with `:`): a source or device, a parameter, `TEMP`, `dev:param`, `model:param` or a path into an instance (`X1:R5:R`). The form does not tell a device from a parameter, nor `dev:param` from `model:param`, so a `.STEP` target''s `kind` is `name`, `qualified` (with `parameter`, the part after the last `:`) or `temp`; a `.DC` target is `DcSweep.source` as written. A target that reads as a number, or with an empty part around a `:`, is a ParseError. Resolving the target against the scope, a parameter first as Xyce does, is X-M2 B5''s.'
