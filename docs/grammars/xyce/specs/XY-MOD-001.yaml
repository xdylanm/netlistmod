id: XY-MOD-001
dialect: xyce
construct: .MODEL statements (parameters with or without parentheses; xyce model types)
manual_ref:
- '[xyce-ref] §2.1.21 p89 ".MODEL (Model Definition)"'
- '[xyce-ref] §2.1.21.2 p90 "Model Binning"'
status: validated
validated_on:
- solver: xyce
  version: XyceNF Release 7.10.0
  date: '2026-11-15'
grammar:
- model_stmt
- model_paren
- model_param_first
core_rules:
- MODEL_KW
- LPAR
- RPAR
- rparen
- param
- x_name
tests:
- tests/grammar/xyce/test_xyce_statements.py::test_model_params_with_or_without_parentheses
- tests/grammar/xyce/test_xyce_statements.py::test_a_model_may_have_no_params
- tests/grammar/xyce/test_xyce_statements.py::test_model_values_are_device_numbers_or_delimited_expressions
- tests/grammar/xyce/test_xyce_statements.py::test_binned_model_names_are_names
- tests/grammar/xyce/test_xyce_statements.py::test_model_lines_take_no_comma_and_one_pair_of_parentheses
- tests/grammar/xyce/test_xyce_statements.py::test_a_repeated_model_parameter_is_rejected
- tests/grammar/xyce/test_xyce_statements.py::test_xyce_has_its_own_model_types
- tests/grammar/xyce/test_xyce_statements.py::test_a_repeated_subckt_or_model_is_reported
- tests/solver/test_xyce_statement_probes.py::test_model_forms
- tests/solver/test_xyce_statement_probes.py::test_xyce_stops_on
validation_note: 'Validated on XyceNF Release 7.10.0: parameters with one pair of parentheses (also glued to the type, or empty) or without, continued by `+` lines, `RES` beside `R`, a name with a `.`, and a device-field number. Xyce stops on a comma, a second pair of parentheses, a parameter written twice, a model defined twice and a bare value.'
notes: '`ModelStatement`, reused from ngspice (decision 0027 item 7; xm1-tasks 5.1 point 18), without ngspice''s flags, dotted values and code-model values. A value is a NUMBER of the device reader (XY-NUM-001), a braced or a quoted expression. A parameter written twice (names folded by case) is a ParseError, keyed per dialect in the transformer; a repeated model is a DUPLICATE_DEFINITION diagnostic that says Xyce stops (_REPEAT_STOPS). Binned names lex as ordinary names; an M line that names a set of bins (`nch` for `nch.1`, `nch.2`) resolves to it in the document layer (X-M4 B4, decision 0031 items 7 and 8; XY-XTR-001, scoping.md S13). The model types are xyce''s own list in model-types.json, which replaces the shared one (model_types._MODES): R and RES, C and CAP, L and IND, CORE (for K), D; each later milestone adds the types of its letters: X-M4 NPN, PNP, NMOS, PMOS, NJF, PJF, NMF and PMF, with no VDMOS (decision 0031 item 6). The type is not checked on the `.model` line.'
