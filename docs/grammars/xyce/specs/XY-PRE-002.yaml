id: XY-PRE-002
dialect: xyce
construct: .PREPROCESS ADDRESISTORS ONETERMINAL|NODCPATH value (an UnknownDirective), and any other .PREPROCESS word refused
manual_ref:
- '[xyce-ref] §2.1.30 p127 ".PREPROCESS ADDRESISTORS (Adding Resistors to Dangling Nodes)"'
- '[xyce-ref] §2.1.28 p125 ".PREPROCESS REPLACEGROUND (Ground Synonym)"'
status: documented
grammar:
- preprocess_addresistors
- pp_addresistors
- pp_kind
- pp_number
- pp_bad_kind
- ADDRESISTORS_KW
- ONETERMINAL_KW
- NODCPATH_KW
- preprocess_other
- pp_word
core_rules:
- NUMBER
tests:
- tests/grammar/xyce/test_xyce_closed_list.py::test_addresistors_is_an_unknown_directive
- tests/grammar/xyce/test_xyce_closed_list.py::test_each_kind_of_addresistors_may_stand_once
- tests/grammar/xyce/test_xyce_closed_list.py::test_conditions_and_preprocess_are_allowed_in_a_body
- tests/grammar/xyce/test_xyce_closed_list.py::test_a_second_addresistors_of_one_kind_is_rejected
- tests/grammar/xyce/test_xyce_closed_list.py::test_a_malformed_addresistors_is_rejected
- tests/grammar/xyce/test_xyce_closed_list.py::test_another_preprocess_word_is_rejected
validation_note: Read from the manual (decision 0028 item 1; xm2-tasks 5.1 point 4). The stage 1 probes on XyceNF Release 7.10.0 are recorded in xm2-tasks 5.1 (ADDRESISTORS writes `<netlist>_xyce.cir` and leaves the run unchanged; two of one kind stop Xyce); the solver tests are X-M2 B6's.
notes: '`.PREPROCESS ADDRESISTORS ONETERMINAL value` and `.PREPROCESS ADDRESISTORS NODCPATH value`, keywords in any case, the value a plain number of the device-field reader (XY-NUM-001), continued by `+` lines: an `UnknownDirective` named `.PREPROCESS` as written, with `UNTYPED_DIRECTIVE_PRESERVED` (info), since it writes another netlist and changes nothing in this one. Allowed wherever `.PREPROCESS` is, in a subcircuit body too. One of each kind per netlist, bodies included: a second ONETERMINAL or a second NODCPATH line is a ParseError at its keyword, since Xyce stops on it. Another word after ADDRESISTORS, a missing or braced value and an extra field are a ParseError. A word after `.PREPROCESS` other than REPLACEGROUND (XY-PRE-001), REMOVEUNUSED (UnsupportedConstruct, XY-UNS-001) and ADDRESISTORS is a ParseError at the word.'
