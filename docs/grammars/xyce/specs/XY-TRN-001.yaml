id: XY-TRN-001
dialect: xyce
construct: .TRAN transient analysis (NOOP, UIC and a schedule)
manual_ref:
- '[xyce-ref] §2.1.38 p161 ".TRAN (Transient Analysis)"'
status: validated
validated_on:
- solver: xyce
  version: XyceNF Release 7.10.0
  date: '2026-11-16'
grammar:
- xy_tran_stmt
- tran_flag
- tran_schedule
- NOOP_KW
- SCHEDULE_FORMULA
core_rules:
- TRAN_KW
- UIC_KW
- value
tests:
- tests/grammar/xyce/test_xyce_analyses.py::test_tran_takes_two_to_four_numbers
- tests/grammar/xyce/test_xyce_analyses.py::test_tran_values_are_device_numbers_or_delimited_expressions
- tests/grammar/xyce/test_xyce_analyses.py::test_tran_takes_noop_and_uic_after_the_numbers
- tests/grammar/xyce/test_xyce_analyses.py::test_tran_takes_a_schedule_last
- tests/grammar/xyce/test_xyce_analyses.py::test_tran_takes_the_manuals_whole_form
- tests/grammar/xyce/test_xyce_analyses.py::test_tran_continues_across_plus_comment_and_indented_lines
- tests/grammar/xyce/test_xyce_analyses.py::test_malformed_tran_is_rejected
- tests/grammar/xyce/test_xyce_analyses.py::test_a_repeated_tran_flag_is_rejected
- tests/grammar/xyce/test_xyce_analyses.py::test_a_schedule_in_a_numbers_place_is_rejected
- tests/grammar/xyce/test_xyce_analyses.py::test_analyses_and_step_are_refused_in_a_body
- tests/solver/test_xyce_analysis_probes.py::test_tran_forms_run_to_tstop
- tests/solver/test_xyce_analysis_probes.py::test_tran_stops_on
- tests/solver/test_xyce_analysis_probes.py::test_a_schedule_after_tstart_stops_xyce
- tests/solver/test_xyce_analysis_probes.py::test_the_manuals_whole_form_stops_xyce
- tests/solver/test_xyce_analysis_probes.py::test_a_repeated_flag_or_a_number_after_one_runs
- tests/solver/test_xyce_analysis_probes.py::test_uic_is_noop
- tests/solver/test_xyce_analysis_probes.py::test_a_schedule_caps_the_time_step
- tests/solver/test_xyce_analysis_probes.py::test_a_stepped_parameter_in_a_tran_field_is_read_once
- tests/solver/test_xyce_closed_list_probes.py::test_a_directive_in_a_body_is_ignored
validation_note: 'Validated on XyceNF Release 7.10.0: each form runs to the tstop the library reads; one value, a fifth number, a comma, a word, a flag before tstop, `j` and `µ` stop Xyce; UIC gives the rows of NOOP; a schedule caps the time step; a stepped parameter in a field is read once; in a body the line is ignored. Xyce stops on a schedule after tstart and on the full form with both flags, which the library reads as the manual writes them (decision 0028 item 3), and runs a repeated flag and a number after a flag, which the library refuses (discrepancies.md).'
notes: '`TranDirective`: `tstep tstop [tstart [tmax]]`, tstep required, numbers of the device-field reader (XY-NUM-001) or expressions in braces or quotes; then `NOOP` and `UIC` (`noop`, `uic`), synonyms, in either order and each at most once (a repeat is a ParseError); then at most one schedule (`schedule`, a `Formula` whose text is `schedule(...)`), braced or quoted, `schedule` in any case with blanks allowed around it. A schedule in a number''s place is refused. No comma, no LTspice modifier (`modifiers` stays empty). Top level only: in a body Xyce silently ignores it, so it is a ParseError there.'
