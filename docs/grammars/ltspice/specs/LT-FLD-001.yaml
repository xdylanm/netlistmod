- '[ltspice-ref] SPICE-SYNTAX-REFERENCE.md "Netlist Structure"'
status: validated
validated_on:
- solver: ltspice
  version: 26.1.1
  date: '2026-11-01'
grammar: []
core_rules:
- eol
- EQ
- CSEP
tests:
- tests/grammar/ltspice/test_ltspice_elements.py::test_param_assignment_spans_slice_back
- tests/grammar/ltspice/test_ltspice_elements.py::test_tc_forms
- tests/solver/test_ltspice_validation.py::test_blanks_tabs_and_the_equals_sign_separate_fields
- tests/solver/test_ltspice_validation.py::test_the_commas_the_library_accepts_run
- tests/solver/test_ltspice_discrepancies.py::test_other_commas_run_but_the_library_rejects_them
notes: 'Blanks, a + line, and = with optional blanks. A comma separates only the forms that load with one
  (discrepancies.md, "Comma forms"): documented, tc values, tbl= and step() lists, table= lists, POLY lists
  and control pairs, and the @ line''s ac=1,0; observed, .model, X and .subckt parameters, .param
  assignments, .options items, .save vectors and the values of a source function (PULSE(0,1,...)). A
  comma inside a formula is formula text. LTspice tolerates a few more commas (discrepancies.md).'
