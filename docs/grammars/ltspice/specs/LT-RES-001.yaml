- R_TEXT_KW
- TC_KW
- NOISELESS_KW
core_rules:
- R_NAME
tests:
- tests/grammar/ltspice/test_ltspice_elements.py::test_resistor_parameters
- tests/grammar/ltspice/test_ltspice_elements.py::test_tc_forms
- tests/grammar/ltspice/test_ltspice_elements.py::test_noiseless_flag
- tests/grammar/ltspice/test_ltspice_elements.py::test_malformed_resistor_lines
- tests/grammar/ltspice/test_ltspice_elements.py::test_a_bare_name_for_a_value_says_what_is_wrong
- tests/grammar/ltspice/test_ltspice_elements.py::test_keyword_values_are_not_ltspice_forms
notes: 'Value, then tc (list), temp and m, a closed list. Observed (section 11.3 rule 3, probed on LTspice
  26.1.1): tol, pwr, tc1, tc2, and mfg and pn (a quoted string or a bare word), which LTspice''s component
  database writes (reviews R1, R10). The noiseless flag is observed; a flag may take a value, which the
  reference documents (review R9). No model and no keyword form.'
