id: LT-RES-001
dialect: ltspice
construct: resistor (R) lines
manual_ref:
- '[ltspice-ref] CIRCUIT-ELEMENTS-REFERENCE.md "R — Resistor"'
- '[ltspice-ref] CIRCUIT-ELEMENTS-REFERENCE.md "Element Overview"'
status: documented
validation_note: T12 (checkpoint B) adds the solver test and sets the status; the forms were probed by
  hand on LTspice 26.1.1 on 2026-11-01 (m8-tasks.md, discrepancies.md).
validated_on: []
grammar:
- resistor
- r_value
- r_param
- tc_param
- bare_name
- noiseless_flag
