id: LT-MOD-001
dialect: ltspice
construct: .model statements
manual_ref:
- '[ltspice-ref] SIMULATION-COMMANDS-REFERENCE.md ".MODEL — SPICE Model Definition"'
status: validated
validated_on:
- solver: ltspice
  version: 26.1.1
  date: '2026-11-01'
- solver: ltspice
  version: 26.1.1
  date: '2026-11-05'
- solver: ltspice
  version: 26.1.1
  date: '2026-11-09'
grammar:
- param
- model_param_first
- MODEL_TEXT_KW
- MODEL_BARE
- model_stmt
- model_ako
- AKO_REF
- model_flag
- model_text
- model_flag_first
- _ltra_flag
- NOSTEPLIMIT_KW
- STEPLIMIT_KW
- NOCONTROL_KW
- LININTERP_KW
- MIXEDINTERP_KW
- TRUNCNR_KW
- TRUNCDONTCUT_KW
core_rules:
- model_paren
- rparen
- MODEL_KW
- LPAR
- RPAR
tests:
- tests/grammar/ltspice/test_ltspice_statements.py::test_model_forms
- tests/grammar/ltspice/test_ltspice_statements.py::test_model_text_parameters
- tests/grammar/ltspice/test_ltspice_statements.py::test_other_model_parameters_reject_a_bare_word
- tests/grammar/ltspice/test_ltspice_statements.py::test_malformed_models
- tests/document/test_ltspice_document.py::test_a_model_text_value_is_not_a_reference
- tests/solver/test_ltspice_validation.py::test_model_forms_read_the_same
- tests/solver/test_ltspice_validation.py::test_a_derived_model_inherits_and_overrides
- tests/solver/test_ltspice_validation.py::test_pn_on_a_model_is_an_ignored_numeric_name
- tests/solver/test_ltspice_discrepancies.py::test_a_bare_word_in_a_model_is_a_parameter_reference_in_ltspice
- tests/grammar/ltspice/test_ltspice_transistors.py::test_a_model_may_carry_a_channel_flag
- tests/grammar/ltspice/test_ltspice_transistors.py::test_a_dotted_model_value_is_text
- tests/solver/test_ltspice_transistor_probes.py::test_a_dotted_model_value_runs
- tests/grammar/ltspice/test_ltspice_lines.py::test_ltra_flags_are_refused_with_a_reason
- tests/solver/test_ltspice_line_probes.py::test_ltra_flags_are_refused
notes: 'With or without parentheses, and ako: derived models. Observed: mfg and type take a quoted string or a bare word, kept verbatim, as in LTspice''s own libraries. Any other bare word is a ParseError with a hint, since LTspice reads it as a parameter reference (reviews R2, R8). pn is not a metadata name on a .model: pn=3M is an open numeric name, LTspice warns at pn=OnSemi and stops at pn=1N4148A, and the library rejects both. A bare pchan or nchan is a flag, and a dotted value such as version=3.3.0 is text, never a number (decision 0014 item 7). LTRA''s ngspice flags are recognised only to be refused: the reference lists only R, L, G, C and Len for LTRA, and LTspice 26.1.1 runs steplimit, nosteplimit and lininterp (discrepancies.md; decision 0019 item 8).'
