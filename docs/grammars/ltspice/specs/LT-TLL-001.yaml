id: LT-TLL-001
dialect: ltspice
construct: lossless transmission line (T) lines
manual_ref:
- '[ltspice-ref] CIRCUIT-ELEMENTS-REFERENCE.md "T — Lossless Transmission Line"'
status: validated
validated_on:
- solver: ltspice
  version: 26.1.1
  date: '2026-11-09'
grammar:
- body_line
- lossless_line
- _t_more
- t_param
- t_unlisted
- T_PARAM_KW
- T_UNLISTED_KW
- T_NAME
- LINE_BARE
core_rules:
- node
- eol
tests:
- tests/grammar/ltspice/test_ltspice_lines.py::test_t_takes_zo_and_td
- tests/grammar/ltspice/test_ltspice_lines.py::test_refused_t_lines_name_the_rule
- tests/grammar/ltspice/test_ltspice_lines.py::test_other_t_forms_are_syntax_errors
- tests/grammar/ltspice/test_ltspice_lines.py::test_a_bare_name_in_a_value_is_refused
- tests/solver/test_ltspice_line_probes.py::test_line_probes
- tests/solver/test_ltspice_line_probes.py::test_what_ltspice_computes_in_ac
- tests/solver/test_ltspice_line_probes.py::test_an_edit_moves_the_result
- tests/solver/test_ltspice_solver_corpus.py::test_accept_fixture_runs_in_ltspice
notes: 'Four nodes, then Zo= (or Z0=, which LTspice''s own tline symbol writes; one parameter, decision 0019 item 3) and Td=, the reference''s names. LTspice 26.1.1 runs F=, NL=, IC=, rel= and abs=, and a line without Td= (a default delay); the library refuses them (discrepancies.md).'
