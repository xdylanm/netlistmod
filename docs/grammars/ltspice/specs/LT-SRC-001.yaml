id: LT-SRC-001
dialect: ltspice
construct: independent sources (V, I)
manual_ref:
- '[ltspice-ref] CIRCUIT-ELEMENTS-REFERENCE.md "V — Voltage Source"'
- '[ltspice-ref] CIRCUIT-ELEMENTS-REFERENCE.md "I — Current Source"'
- '[ltspice-ref] CIRCUIT-ELEMENTS-REFERENCE.md "Element Overview"'
status: validated
validated_on:
- solver: ltspice
  version: 26.1.1
  date: '2026-11-01'
grammar:
- voltage_source
- ac_spec
- v_param
- V_PARAM_KW
- current_source
- load_flag
- resistive_load
- LOAD_KW
- I_R_KW
- _v0
- _vq
- _vf
- trigger_param
- TRIGGER_KW
- TRIP_KW
- TRIGGER_EXPR
- _if
- _i_fn
- _ld
- _ldq
- _ldam
- _lda
- _lam
- _la
- _qd
- _qdam
- _qda
- _qam
- _qa
- _id
- _idam
- _ida
- _iam
- _ia
core_rules:
- dc_spec
- dc_keyword
- V_NAME
- I_NAME
- DC_KW
- AC_KW
tests:
- tests/grammar/test_source_functions.py::test_i_line_forms_outside_the_reference_are_refused
- tests/grammar/test_source_functions.py::test_i_line_forms_that_stay
- tests/solver/test_ltspice_source_functions.py::test_forms_outside_the_reference_that_run_and_the_library_refuses
- tests/solver/test_ltspice_source_functions.py::test_a_trigger_on_an_i_line_stops_ltspice
- tests/grammar/ltspice/test_ltspice_elements.py::test_voltage_sources
- tests/grammar/ltspice/test_ltspice_elements.py::test_voltage_source_forms
- tests/grammar/ltspice/test_ltspice_elements.py::test_malformed_voltage_sources
- tests/grammar/ltspice/test_ltspice_elements.py::test_current_sources
- tests/grammar/ltspice/test_ltspice_elements.py::test_malformed_current_sources
- tests/solver/test_ltspice_validation.py::test_voltage_source_forms
- tests/solver/test_ltspice_validation.py::test_a_source_without_a_value_runs_with_a_warning
- tests/solver/test_ltspice_validation.py::test_current_source_forms
- tests/solver/test_ltspice_validation.py::test_a_load_source_sinks_its_current
- tests/solver/test_ltspice_validation.py::test_current_source_forms_without_a_dc_value
- tests/solver/test_ltspice_validation.py::test_malformed_current_sources_stop_both
notes: 'V: value, AC magnitude and phase with or without =, Rser, Cpar. I: a value, an AC part or R=, and the load flag, with or without a value (review R9). AC without = and the DC keyword are observed (LTspice''s own export writes AC 1). A V line without a value runs with a warning, read as 0 V.'
