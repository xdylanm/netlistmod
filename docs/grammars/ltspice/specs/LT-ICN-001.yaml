id: LT-ICN-001
dialect: ltspice
construct: .ic and .nodeset
manual_ref:
- '[ltspice-ref] TROUBLESHOOTING-GUIDE.md "Circuit Directives"'
- '[ltspice-ref] TROUBLESHOOTING-GUIDE.md "Tips"'
status: validated
validated_on:
- solver: ltspice
  version: 26.1.1
  date: '2026-11-01'
grammar:
- node_condition
- ic_stmt
- current_condition
core_rules:
- ic_stmt
- nodeset_stmt
- IC_KW
- NODESET_KW
- V_OPEN
tests:
- tests/grammar/ltspice/test_ltspice_statements.py::test_initial_conditions
- tests/grammar/ltspice/test_ltspice_statements.py::test_inductor_currents_in_ic
- tests/grammar/ltspice/test_ltspice_statements.py::test_malformed_initial_conditions
- tests/document/test_ltspice_document.py::test_an_ic_current_is_indexed_like_a_saved_current
- tests/solver/test_ltspice_validation.py::test_ic_sets_a_node_voltage
- tests/solver/test_ltspice_validation.py::test_ic_sets_an_inductor_current
- tests/solver/test_ltspice_validation.py::test_nodeset_runs
- tests/solver/test_ltspice_validation.py::test_all_stops_both
- tests/solver/test_ltspice_discrepancies.py::test_other_initial_conditions_run_but_the_library_rejects_them
notes: V(node)=value items, and for .ic the inductor currents I(L...)=value, which the reference documents
  (review R3). all= is an error in LTspice, unlike ngspice. .nodeset takes voltages only.
