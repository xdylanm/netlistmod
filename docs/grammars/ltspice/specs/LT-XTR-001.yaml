id: LT-XTR-001
dialect: ltspice
construct: shared transistor line shape (Q, M, J, Z)
manual_ref:
- '[ltspice-ref] CIRCUIT-ELEMENTS-REFERENCE.md "Element Overview"'
status: validated
validated_on:
- solver: ltspice
  version: 26.1.1
  date: '2026-11-05'
- solver: ltspice
  version: 26.1.1
  date: '2026-11-11'
grammar:
- body_line
- t_area
- FIELD_EMBEDDED
- FIELD_NUMBER
- ic_param
- _lt_value
- IC_PARAM_KW
- IC_COMMA
tests:
- tests/grammar/ltspice/test_ltspice_transistors.py::test_the_model_is_the_last_name
- tests/grammar/ltspice/test_ltspice_transistors.py::test_a_model_name_cannot_be_a_keyword
- tests/grammar/ltspice/test_ltspice_transistors.py::test_ic_takes_a_comma_list
- tests/grammar/ltspice/test_ltspice_transistors.py::test_a_number_after_an_m_model_is_refused_as_the_model
- tests/solver/test_ltspice_transistor_probes.py::test_transistor_probes
- tests/solver/test_ltspice_value_probes.py::test_an_area_with_any_letter_reads_as_ltspice_reads_it
- tests/solver/test_ltspice_value_probes.py::test_a_number_after_an_m_model_stops_ltspice_and_is_refused
notes: 'Decision 0014 items 1 to 5, as NG-XTR-001. An embedded decimal (1n5) is an area only where no name may follow: Q1 c b e s 2N3904 reads 2N3904 as the model. A model named with a plain number, which LTspice runs, is refused (item 4). ic_param is used by M only: IC= is not on the closed lists of Q, J and Z. M18 A1-4: a positional number takes any letter after it, as LTspice''s NUMBER does (FIELD_NUMBER is overridden), so Q1 c b 0 qm 1μ has the area 1μ, which LTspice 26.1.1 reads as 1e-6, and 2Ω is an area of 2; on M, which has no positional area, a number with any letter in the model''s place is refused, as 2 is (LTspice stops: Unknown parameter).'
