id: LT-COM-002
dialect: ltspice
construct: end-of-line comments (; and space-$-space)
manual_ref:
- '[ltspice-ref] SPICE-SYNTAX-REFERENCE.md "Comments and Line Continuation"'
status: validated
validated_on:
- solver: ltspice
  version: 26.1.1
  date: '2026-11-01'
grammar:
- TRAILING_COMMENT
tests:
- tests/grammar/ltspice/test_ltspice_structure.py::test_end_of_line_comments
- tests/grammar/ltspice/test_ltspice_structure.py::test_dollar_needs_a_space_on_both_sides
- tests/grammar/ltspice/test_ltspice_structure.py::test_double_slash_is_not_a_comment
- tests/solver/test_ltspice_validation.py::test_end_of_line_comments_hide_the_rest_of_the_line
- tests/solver/test_ltspice_validation.py::test_other_comment_forms_stop_both
notes: '; is documented. $ is not in the reference: LTspice 26.1.1 reads it as a comment only with a space on both sides (observed, section 11.3 rule 3). // is not a comment.'
