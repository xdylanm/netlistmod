id: LT-IND-001
dialect: ltspice
construct: inductor (L) lines
manual_ref:
- '[ltspice-ref] CIRCUIT-ELEMENTS-REFERENCE.md "L — Inductor"'
- '[ltspice-ref] CIRCUIT-ELEMENTS-REFERENCE.md "Element Overview"'
status: validated
validated_on:
- solver: ltspice
  version: 26.1.1
  date: '2026-11-01'
- solver: ltspice
  version: 26.1.1
  date: '2026-11-06'
grammar:
- inductor
- l_param
- L_PARAM_KW
- L_TEXT_KW
- l_flux
- hysteretic_param
- FLUX_KW
- HYSTERETIC_KW
core_rules:
- L_NAME
tests:
- tests/grammar/ltspice/test_ltspice_elements.py::test_inductor_parameters
- tests/grammar/ltspice/test_ltspice_elements.py::test_other_parameters_are_rejected
- tests/grammar/ltspice/test_ltspice_elements.py::test_nonlinear_forms_load
- tests/grammar/ltspice/test_ltspice_behavioral.py::test_the_flux_and_hysteretic_forms_of_l
- tests/solver/test_ltspice_validation.py::test_inductor_parameters_run
- tests/solver/test_ltspice_validation.py::test_inductor_parameters_take_effect
- tests/solver/test_ltspice_validation.py::test_malformed_inductor_lines_stop_both
notes: 'Value, then ic, Rser, Rpar, Cpar, m, temp, tc1, tc2. Observed (section 11.3 rule 3): Ipk, the
  noiseless flag (with or without a value, review R9), and mfg and pn, which take a quoted string or a
  bare word (review R1). Flux= loads with value None and the expression in flux, where x is the current
  through the inductor; the hysteretic core (Hc, Bs, Br, A, Lm, Lg, N) loads with no value and those as
  parameters (decision 0016 item 4).'
