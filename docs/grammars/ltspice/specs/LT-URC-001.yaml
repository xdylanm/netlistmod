id: LT-URC-001
dialect: ltspice
construct: uniform RC line (U) lines
manual_ref:
- '[ltspice-ref] CIRCUIT-ELEMENTS-REFERENCE.md "U — Uniform RC-Line"'
status: validated
validated_on:
- solver: ltspice
  version: 26.1.1
  date: '2026-11-09'
grammar:
- body_line
- rc_line
- u_param
- U_PARAM_KW
- U_BARE
- U_NAME
core_rules:
- node
- model
- eol
tests:
- tests/grammar/ltspice/test_ltspice_lines.py::test_u_is_a_urc_line
- tests/grammar/ltspice/test_ltspice_lines.py::test_a_bare_parameter_is_a_bare_formula
- tests/grammar/ltspice/test_ltspice_lines.py::test_refused_u_lines
- tests/solver/test_ltspice_line_probes.py::test_line_probes
- tests/solver/test_ltspice_line_probes.py::test_what_ltspice_computes_in_op
- tests/solver/test_ltspice_line_probes.py::test_an_edit_moves_the_result
- tests/solver/test_ltspice_solver_corpus.py::test_accept_fixture_runs_in_ltspice
notes: 'Three nodes, a URC model, then L= (required: LTspice stops without it) and an optional N=, in either order. A value may be a bare parameter name (L=len), which LTspice reads; it is a Formula with an empty delimiter. U is only a URC line on LTspice.'
