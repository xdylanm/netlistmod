id: LT-CNT-001
dialect: ltspice
construct: + continuation lines
manual_ref:
- '[ltspice-ref] SPICE-SYNTAX-REFERENCE.md "Comments and Line Continuation"'
status: validated
validated_on:
- solver: ltspice
  version: 26.1.1
  date: '2026-11-01'
- solver: ltspice
  version: 26.1.1
  date: '2026-11-11'
grammar: []
core_rules:
- CONT
- NL
- LINE_END
- SEP
tests:
- tests/grammar/ltspice/test_ltspice_structure.py::test_continuation_must_follow_immediately
- tests/grammar/ltspice/test_ltspice_structure.py::test_backslash_continuation_is_rejected
- tests/solver/test_ltspice_validation.py::test_continuation_lines_join_the_statement
- tests/solver/test_ltspice_validation.py::test_backslash_continuation_stops_both
- tests/solver/test_ltspice_discrepancies.py::test_a_continuation_across_other_lines_runs_but_the_library_rejects_it
- tests/grammar/ltspice/test_ltspice_structure.py::test_a_comment_only_plus_line_may_end_a_statement
- tests/grammar/ltspice/test_ltspice_structure.py::test_a_comment_only_plus_line_after_ends_belongs_to_the_definition
- tests/grammar/ltspice/test_ltspice_structure.py::test_a_comment_only_plus_line_ends_a_statement_with_either_line_ending
- tests/grammar/ltspice/test_ltspice_structure.py::test_a_comment_only_plus_line_before_a_field_continues
- tests/grammar/ltspice/test_ltspice_structure.py::test_a_comment_only_plus_line_after_a_comment_line_is_refused
- tests/grammar/ltspice/test_ltspice_structure.py::test_ngspice_still_reads_a_comment_only_plus_line
- tests/solver/test_ltspice_m18_probes.py::test_comment_only_plus_line_probes
- tests/solver/test_ltspice_m18_probes.py::test_ngspice_runs_and_loads_a_comment_only_plus_line
notes: 'The + line must follow immediately; LTspice also joins across comment and blank lines (discrepancies.md).
  No backslash continuation (L24). A + line that holds only a comment (; or space, $, space) continues
  the statement, and its comment is one of the statement''s trailing comments, also as the last line
  (P13; M18 review R1). LTspice 26.1.1 stops on a statement whose last + line that is not blank holds
  only a comment ("Syntax error"), unless a later + line holds a field, except at the end of a .subckt
  header with ports only (discrepancies.md).'
