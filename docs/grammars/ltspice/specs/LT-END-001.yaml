id: LT-END-001
dialect: ltspice
construct: required final .end
manual_ref:
- '[ltspice-ref] SPICE-SYNTAX-REFERENCE.md "Netlist Structure"'
- '[ltspice-ref] SIMULATION-COMMANDS-REFERENCE.md ".END — End of Netlist"'
status: documented
validation_note: T12 (checkpoint B) adds the solver test and sets the status; the forms were probed by
  hand on LTspice 26.1.1 on 2026-11-01 (m8-tasks.md, discrepancies.md).
validated_on: []
grammar:
- END_KW
- end_stmt
core_rules:
- end_stmt
- trailer
tests:
- tests/grammar/ltspice/test_ltspice_structure.py::test_end_is_required_with_only_blank_lines_after_it
- tests/grammar/ltspice/test_ltspice_structure.py::test_top_level_shape
notes: 'A deliberate exception to the rule that the grammar follows the manual (decision 0009 item 4):
  the reference allows omitting .end and ignores text after it; the library requires it, with only blank
  lines after it. discrepancies.md records this.'
