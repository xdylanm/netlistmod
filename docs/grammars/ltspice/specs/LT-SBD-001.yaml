id: LT-SBD-001
dialect: ltspice
construct: .subckt ... .ends definitions
manual_ref:
- '[ltspice-ref] SIMULATION-COMMANDS-REFERENCE.md ".SUBCKT / .ENDS — Subcircuit Definition"'
status: validated
validated_on:
- solver: ltspice
  version: 26.1.1
  date: '2026-11-01'
- solver: ltspice
  version: 26.1.1
  date: '2026-11-11'
grammar:
- subckt_header
- not_in_subckt
core_rules:
- subckt_def
- subckt_port
- subckt_item
- ends_line
- SUBCKT_KW
- ENDS_KW
- ZERO_PORT
tests:
- tests/grammar/ltspice/test_ltspice_elements.py::test_subcircuit_headers
- tests/grammar/ltspice/test_ltspice_elements.py::test_a_port_cannot_be_zero
- tests/grammar/ltspice/test_ltspice_statements.py::test_top_level_statements_are_rejected_in_a_body
- tests/solver/test_ltspice_validation.py::test_subcircuit_headers
- tests/solver/test_ltspice_value_probes.py::test_subckt_parameter_commas_run_and_load
- tests/solver/test_ltspice_value_probes.py::test_a_comma_right_after_params_stops_ltspice_and_is_refused
- tests/grammar/ltspice/test_ltspice_elements.py::test_a_comma_right_after_params_is_refused
- tests/grammar/ltspice/test_ltspice_elements.py::test_the_first_parameter_after_params_takes_a_blank_or_a_plus_line
- tests/solver/test_ltspice_m18_probes.py::test_comma_after_params_probes
- tests/solver/test_ltspice_validation.py::test_definitions_nest
- tests/solver/test_ltspice_validation.py::test_top_level_statements_in_a_body_stop_both
- tests/solver/test_ltspice_discrepancies.py::test_a_port_named_0_runs_but_the_library_rejects_it
notes: 'Definitions nest. Top-level statements are rejected in a body; LTspice tolerates .ic and .nodeset
  there, and a port named 0 (discrepancies.md). Observed (M18 decision 10): a comma may stand before a
  default parameter, as on X (x_param): r=1k, q=2, with or without params: and with or without blanks
  around the comma, which LTspice 26.1.1 runs. A comma right after params: is refused (M18 D2): LTspice
  stops on it ("Expected end of line here"), and the first parameter after params: is params_first
  (LT-SUB-001). A comma between ports is refused.'
