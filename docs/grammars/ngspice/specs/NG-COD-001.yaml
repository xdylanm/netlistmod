- tests/document/test_special_topology.py::test_changing_a_port_or_its_source_is_a_topology_violation
- tests/document/test_special_topology.py::test_tilde_is_not_topology
- tests/document/test_special_topology.py::test_a_missing_vnam_source_is_unresolved
- tests/solver/test_ngspice_special_probes.py::test_code_model_probes
- tests/solver/test_ngspice_special_probes.py::test_what_ngspice_computes
- tests/solver/test_ngspice_special_probes.py::test_a_code_model_edit_moves_the_result
- tests/solver/test_ngspice_corpus.py::test_accept_fixture_runs_in_ngspice
notes: 'Ports, then the model, the last name on the line (decision 0020 item 4). A port is a connection or a vector [ ... ] of connections; a connection is an optional port type of Table 8.1 (any case) and its node, two for a differential type, with or without parentheses and with or without a blank before them; or null (any case); or %vnam and a source, which is a controlling reference and not a net. A digital node may carry ~ with no blank. A port type may stand before a vector and applies to each of its untyped connections; with a differential type, each untyped connection is a pair of nodes (§8.1.1 Example 1, %vd [1 2 3 4]). The port count and types, and where null is allowed, are not checked: the library cannot see a code model''s interface. Refused: a name=value on the line and a number as the model (ngspice stops); %vnam inside a vector (ngspice stops: unknown controlling source); a comma inside a vector or inside parentheses, and ~ before a blank (ngspice runs them; the manual writes blanks: discrepancies.md). The signature records each port''s position, vector flag and type, and each connection''s type, nodes and null; ~ is left out.'
