- tests/grammar/ngspice/test_special.py::test_vnam_names_a_source_that_is_not_a_node
- tests/grammar/ngspice/test_special.py::test_spans_slice_back_to_their_text
- tests/grammar/ngspice/test_special.py::test_comments_inside_a_continued_line_are_kept
