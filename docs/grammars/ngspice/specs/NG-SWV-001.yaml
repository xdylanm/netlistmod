id: NG-SWV-001
dialect: ngspice
construct: voltage-controlled switch (S) lines
manual_ref:
- '[ngspice-manual] §3.3.15 "Switches"'
- '[ngspice-manual] §3.3.16 "Switch Model (SW/CSW)"'
status: validated
validated_on:
- solver: ngspice
  version: '47'
  date: '2026-11-06'
- solver: ngspice
  version: '47'
  date: '2026-11-14'
grammar:
- S_NAME
- vswitch
tests:
- tests/grammar/ngspice/test_controlled_sources.py::test_switches_take_a_model_and_an_optional_state
- tests/grammar/ngspice/test_controlled_sources.py::test_a_model_named_off_is_the_model
- tests/grammar/ngspice/test_controlled_sources.py::test_malformed_lines_are_rejected
- tests/solver/test_ngspice_controlled_probes.py::test_controlled_source_probes
- tests/solver/test_ngspice_controlled_probes.py::test_the_state_sets_a_switch_inside_its_hysteresis
- tests/solver/test_ngspice_corpus.py::test_accept_fixture_runs_in_ngspice
- tests/grammar/test_number_model_names.py::test_a_number_is_not_a_model_name_on_d_s_and_w
- tests/grammar/test_number_model_names.py::test_a_part_number_is_a_model_name
- tests/solver/test_ngspice_number_model_probes.py::test_number_model_probes
notes: 'Four nodes, a mandatory SW model, then ON or OFF in any case. Both states together are refused although ngspice 47 runs them and the last wins (decision 0015 item 8).
  A field read as a number (digits, then letters only, as in 2, 4093, 1k or 4093B) is never the
  model and is a ParseError (decision 0024, extending decision 0021 item 1); ngspice 47 stops on a
  pure number there ("Unable to find definition of model"). A part number such as 2N2 stays a model.'
