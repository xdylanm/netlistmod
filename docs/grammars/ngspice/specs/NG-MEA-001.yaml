id: NG-MEA-001
dialect: ngspice
construct: .meas / .measure (shallow)
manual_ref:
- '[ngspice-manual] §11.4 "Measurements after AC, DC and Transient Analysis"'
- '[ngspice-manual] §11.4.3 "General remarks"'
status: validated
validated_on:
- solver: ngspice
  version: '47'
  date: '2026-10-30'
grammar:
- meas_stmt
- meas_analysis
- meas_body
- MEAS_KW
- MEASURE_KW
- TRAN_ANALYSIS_KW
- SP_KW
tests:
- tests/grammar/ngspice/test_statements.py::test_measure_directive_is_typed_shallowly
- tests/grammar/ngspice/test_statements.py::test_malformed_measure_directives_are_rejected
- tests/solver/test_ngspice_solver_statements.py::test_solver_runs_these_and_the_library_follows_the_manual
- tests/grammar/ngspice/test_element_oracle.py::test_generated_statements_and_subcircuits_match_the_generator
- tests/roundtrip/test_ngspice_statements.py::test_accept_corpora_round_trip_and_tile_including_bodies
- tests/roundtrip/test_ngspice_statements.py::test_every_sub_span_slices_back_to_its_text
- tests/roundtrip/test_ngspice_statements.py::test_rejection_corpus_reports_manifest_positions_and_kinds
- tests/solver/test_ngspice_solver_statements.py::test_accept_corpus_runs_in_ngspice
notes: 'Typed shallowly: the analysis (dc, ac, tran, sp; case-insensitive, recorded as written) and the
  result name are fields; the rest is statement text (NG-TXT-001) kept as body_text with a span. Settled:
  another analysis word is rejected; a .meas with only the analysis and the result is rejected (ngspice
  47 warns of an incomplete measurement and runs: discrepancy).'
