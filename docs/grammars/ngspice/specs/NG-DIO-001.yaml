id: NG-DIO-001
dialect: ngspice
construct: junction diode (D) lines
manual_ref:
- '[ngspice-manual] §7.2 "Junction Diodes"'
- '[ngspice-manual] §7.1 "Instance lines and .model lines"'
status: validated
validated_on:
- solver: ngspice
  version: '47'
  date: '2026-10-30'
- solver: ngspice
  version: '47'
  date: '2026-10-31'
- solver: ngspice
  version: '47'
  date: '2026-11-14'
grammar:
- diode
- D_NAME
tests:
- tests/grammar/ngspice/test_elements.py::test_diode_model_parameters_and_off_flag
- tests/grammar/ngspice/test_elements.py::test_malformed_diode_lines_are_rejected
- tests/solver/test_ngspice_solver_elements.py::test_digit_leading_model_name_agrees_with_solver
- tests/solver/test_ngspice_solver_elements.py::test_accept_corpus_runs_in_ngspice
- tests/grammar/test_number_model_names.py::test_a_number_is_not_a_model_name_on_d_s_and_w
- tests/grammar/test_number_model_names.py::test_a_part_number_is_a_model_name
- tests/solver/test_ngspice_number_model_probes.py::test_number_model_probes
notes: D n+ n- mname, then parameters and the off flag in any order. The model is mandatory; the area
  is a named parameter only (a positional area is rejected). A model name may start with a digit (1n4148),
  as ngspice 47 accepts.
  A field read as a number (digits, then letters only, as in 2, 4093, 1k, 4093B or 1e3) is never the
  model and is a ParseError (decision 0024, extending decision 0021 item 1); ngspice 47 stops on a
  pure number there and runs 4093B or 1kohm as a name (discrepancies.md). A part number such as
  1n4148, 1N4148_OJ, CD4093 or 4N25 stays a model.
