notes: 'Decision 0017 items 1, 3 and 4. E and G write TABLE {expression} = points, with the expression in braces or quotes and = optional; E also writes the four-node form, TABLE = points after the control nodes, which G does not (ngspice stops, so it is a ParseError). The points are pairs, each in its own parentheses, or one flat list, with commas or blanks: each list is a core fn_list. The line keeps its class with value None, form "table", the expression (TABLE {expr} only) and a Table holding the points. At least one point; a pair has two values and a flat list an even count. The values are numbers: the manual allows no parameters and ngspice 47 runs some forms wrongly (a bare expression gives 4.0 where the table gives 2.67), so a bare expression, a formula and a name in a point are refused (discrepancies.md). m= follows the points on G only. A net named table (any case) stops ngspice in any node position of E and G, as value does, and is refused at the node.'
