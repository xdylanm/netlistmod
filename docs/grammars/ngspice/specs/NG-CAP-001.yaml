id: NG-CAP-001
dialect: ngspice
construct: capacitor (C) lines
manual_ref:
- '[ngspice-manual] §3.3.6 "Capacitors"'
- '[ngspice-manual] §3.3.7 "Semiconductor Capacitors"'
- '[ngspice-manual] §3.3.9 "Capacitors, dependent on expressions (behavioral capacitor)"'
status: validated
validated_on:
- solver: ngspice
  version: '47'
  date: '2026-10-30'
- solver: ngspice
  version: '47'
  date: '2026-10-31'
- solver: ngspice
  version: '47'
  date: '2026-11-06'
- solver: ngspice
  version: '47'
  date: '2026-11-14'
grammar:
- capacitor
- c_keyword_value
- C_NAME
- C_KW
- CAPACITANCE_KW
- c_charge
- Q_KW
tests:
- tests/grammar/ngspice/test_elements.py::test_capacitor_forms
- tests/grammar/ngspice/test_elements.py::test_keyword_value_forms_fill_the_value_slot
- tests/grammar/ngspice/test_elements.py::test_malformed_capacitor_and_inductor_lines_are_rejected
- tests/grammar/ngspice/test_elements.py::test_charge_form_of_a_capacitor_loads
- tests/grammar/ngspice/test_behavioral.py::test_the_charge_form_of_c
- tests/solver/test_ngspice_behavioral_probes.py::test_the_charge_form_runs_and_loads
- tests/solver/test_ngspice_solver_elements.py::test_accept_corpus_runs_in_ngspice
- tests/solver/test_ngspice_solver_elements.py::test_rc_filter_is_at_minus_3_db_at_its_corner
- tests/grammar/ngspice/test_elements.py::test_a_number_is_never_a_model_where_no_value_can_stand
- tests/grammar/test_number_model_names.py::test_a_number_after_an_ngspice_value_is_not_a_model_name
- tests/grammar/test_number_model_names.py::test_a_part_number_after_an_ngspice_value_is_a_model_name
- tests/solver/test_ngspice_number_model_probes.py::test_number_model_probes
- tests/solver/test_ngspice_number_model_probes.py::test_a_number_after_a_value_is_the_value
notes: 'Same shape as R with c= / capacitance=; a value or a model is required (§3.3.7: without a value,
  the capacitance comes from mname). The charge form q=''expr'' or q={expr} loads with value None and the
  expression in charge (decision 0016 item 4).
  A field read as a number (digits, then letters only, as in 2, 2p or 4093) after the value is never
  the model and is a ParseError (decision 0024, extending decision 0021 item 1); ngspice 47 reads it
  as the value (R1 a 0 1k 4093 is 4093 ohms), which the library read as a model before 1.0
  (discrepancies.md). A part number such as 1n4148 or 2N2222 there stays a model.'
