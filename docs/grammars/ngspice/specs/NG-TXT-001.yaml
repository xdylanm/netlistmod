id: NG-TXT-001
dialect: ngspice
construct: free text, quoted and braced segments, and trailing comments
manual_ref:
  - '[ngspice-manual] §2.4.4 "End-of-line comments"'
status: observed
validated_on:
  - solver: ngspice
    version: "47"
    date: "2026-10-22"
grammar:
  - rest
  - TRAILING_COMMENT
  - TEXT
  - QUOTED
tests:
  - tests/grammar/ngspice/test_structure.py::test_trailing_comment_spans_preserve_marker_and_offset
  - tests/grammar/ngspice/test_structure.py::test_quotes_are_grouped_but_braces_do_not_protect_comment_markers
  - tests/grammar/ngspice/test_structure.py::test_r2_rejects_report_source_position_and_excerpt
  - tests/solver/test_ngspice_solver_structure.py::test_quoted_and_braced_include_paths_probe_free_text
notes: Matched quote pairs protect comment markers in generic text; braces are ordinary text and do not protect them. The manual is silent on quoting in generic directive text; this narrow reading is consistent with the ngspice 47 include-path probe. A trailing comment on .end is rejected under §2.4.2 and §2.4.4; an otherwise empty ; or $ line is rejected under §2.4.4.
