id: NG-OPA-002
dialect: ngspice
construct: opaque .include and .lib statements, and .lib blocks
manual_ref:
  - '[ngspice-manual] §2.8 ".INCLUDE"'
  - '[ngspice-manual] §2.10 ".LIB"'
  - '[ngspice-manual] §2.4.5 "Continuation lines"'
status: validated
validated_on:
  - solver: ngspice
    version: "47"
    date: "2026-10-30"
  - solver: ngspice
    version: "47"
    date: "2026-10-31"
grammar:
  - statement
  - include_stmt
  - lib_stmt
  - INCLUDE_KW
  - LIB_KW
  - lib_block
  - lib_line
  - LIB_BLOCK_KW
  - ENDL_KW
tests:
  - tests/grammar/test_lib_blocks.py::test_the_body_of_a_block_is_not_topology
  - tests/grammar/test_lib_blocks.py::test_blocks_do_not_nest
  - tests/solver/test_decision_0012_probes.py::test_ngspice_stops_on_a_block_in_a_netlist
  - tests/solver/test_decision_0012_probes.py::test_ngspice_reads_a_section_and_adds_its_elements
  - tests/grammar/ngspice/test_structure.py::test_structural_nodes_are_typed_and_spans_tile_source
  - tests/grammar/ngspice/test_structure.py::test_continuations_require_immediate_previous_statement
  - tests/grammar/ngspice/test_structure.py::test_include_and_lib_cannot_be_continued
  - tests/solver/test_ngspice_solver_structure.py::test_include_and_lib_continuation_fails_in_both
notes: .include and .lib cannot be continued (§2.4.5); they end at the line terminator, so a following + line is a syntax error at its position. ngspice 47 also rejects such netlists (the + line is not joined). M2 treats each .lib line as one opaque statement; a .lib name … .endl definition block is a documented limitation.
