id: NG-DIR-001
dialect: ngspice
construct: unknown dot-commands and stray block terminators
manual_ref:
  - '[ngspice-manual] §2.1.1 "Input file structure"'
  - '[ngspice-manual] §2.1.2.3 "Dot command couple completion"'
status: validated
validated_on:
  - solver: ngspice
    version: '47'
    date: '2026-10-31'
grammar:
  - unknown_stmt
  - DOT_NAME
tests:
  - tests/grammar/ngspice/test_structure.py::test_structural_nodes_are_typed_and_spans_tile_source
  - tests/grammar/ngspice/test_structure.py::test_stray_block_closers_are_rejected
  - tests/grammar/ngspice/test_statements.py::test_other_dot_commands_stay_unknown_directives
  - tests/grammar/ngspice/test_statements.py::test_stray_ends_is_rejected
  - tests/solver/test_ngspice_validation.py::test_unknown_dot_commands_run_and_stay_unknown_directives
  - tests/solver/test_ngspice_validation.py::test_a_func_directive_takes_effect_in_a_value
  - tests/solver/test_ngspice_validation.py::test_a_stray_endc_runs_with_a_warning_but_the_library_rejects_it
  - tests/solver/test_ngspice_validation.py::test_stray_conditional_terminators_fail_in_both
  - tests/solver/test_ngspice_solver_statements.py::test_solver_and_library_both_reject
notes: Unknown dot-commands are retained as opaque text. Typed since M4 (and so no longer unknown) are .param, .model, .subckt/.ends, .tran, .ac, .dc, .op, .options/.option, .temp, .ic, .nodeset, .save and .meas/.measure; every other dot-command, including .opt, .print, .plot, .probe, .four and .func, stays an UnknownDirective (.global is typed since M5, NG-GLB-001). The stray block terminators are .endc, .endif, .else, .elseif and .ends. A lone carriage return is accepted within directive text, not as a line ending. ngspice 47 (M7) runs .print, .width (ignored with a warning) and .func, which takes effect in a value ({dbl(1k)}); the library keeps all three as UnknownDirective. A stray .ends, .endif, .else or .elseif fails in both; a stray .endc runs in ngspice with a warning and is rejected here (discrepancies.md).
