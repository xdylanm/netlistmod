id: NG-DIR-001
dialect: ngspice
construct: unknown dot-commands and stray block terminators
manual_ref:
  - '[ngspice-manual] §2.1.1 "Input file structure"'
  - '[ngspice-manual] §2.1.2.3 "Dot command couple completion"'
status: documented
grammar:
  - unknown_stmt
  - DOT_NAME
tests:
  - tests/grammar/ngspice/test_structure.py::test_structural_nodes_are_typed_and_spans_tile_source
  - tests/grammar/ngspice/test_structure.py::test_stray_block_closers_are_rejected
  - tests/grammar/ngspice/test_statements.py::test_other_dot_commands_stay_unknown_directives
  - tests/grammar/ngspice/test_statements.py::test_stray_ends_is_rejected
notes: Unknown dot-commands are retained as opaque text. Typed since M4 (and so no longer unknown) are .param, .model, .subckt/.ends, .tran, .ac, .dc, .op, .options/.option, .temp, .ic, .nodeset, .save and .meas/.measure; every other dot-command, including .opt, .print, .plot, .probe, .four and .func, stays an UnknownDirective (.global is typed since M5, NG-GLB-001). The stray block terminators are .endc, .endif, .else, .elseif and .ends. A lone carriage return is accepted within directive text, not as a line ending.
