notes: 'Decision 0016 item 3. The line keeps its M14 class (Vcvs, Vccs) with value None, form set to
  the keyword and expression set; G takes m=. vol= and cur= take quotes or braces, and a bare
  expression there, which stops ngspice 47, is refused with its own message. value takes = or not.
  TABLE, POLY, FREQ and AND/OR/NAND/NOR are NG-TBL-001, NG-PLY-001 and NG-XSP-001 (M15b).'
