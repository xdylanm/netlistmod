id: NG-UNS-001
dialect: ngspice
construct: recognised but unsupported element forms
manual_ref:
- '[ngspice-manual] §4.1 "Independent Sources for Voltage or Current"'
- '[ngspice-manual] §2.11.3 "Subcircuit parameters"'
status: validated
validated_on:
- solver: ngspice
  version: '47'
  date: '2026-10-31'
grammar:
- params_keyword
- PARAMS_KW
tests:
- tests/grammar/ngspice/test_elements.py::test_malformed_subcircuit_calls_are_rejected
- tests/roundtrip/test_ngspice_elements.py::test_rejection_corpus_reports_manifest_positions_and_kinds
- tests/solver/test_ngspice_validation.py::test_params_keyword_on_an_x_line_runs_but_the_library_rejects_it
- tests/grammar/ngspice/test_lines.py::test_any_other_u_shape_is_the_digital_u
notes: 'params: on an X line is a ParseError. It is a grammar rule whose arguments are statement text up to the end of the (possibly continued) line, so the next line is still its own statement. The error is raised by the transformer after the whole source has parsed, so a syntax error anywhere is reported first. ngspice 47 runs params: on an X line (2.0 V with params: r=2k), which the library rejects (discrepancies.md). The charge form of a capacitor loads since M15 (NG-CAP-001). The nonlinear dependent source forms of M15b (TABLE, POLY, FREQ, AND/OR/NAND/NOR) load since decision 0017 (NG-TBL-001, NG-PLY-001, NG-XSP-001). A U line of any shape but a URC line''s (four names before its first name=value) is the ngspice digital U, a named v1 exclusion (decision 0020 item 1): it raises UnsupportedConstruct ("ngspice digital U device, out of scope for v1", NG-URC-001; decision 0019 item 7).'
